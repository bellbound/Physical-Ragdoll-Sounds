; RagdollSounds_Algorithm_Surfaces.ini - one block per floor you have opened
;
; Split out of a testbench config by tools/deploy-config.py. A surface with no
; block inherits from its parent - metal, glass and ice from stone; dirt, gravel,
; snow, water and body from soft; a puddle from water and bone from body - and a
; root with no block takes the [Surfaces] section of RagdollSounds_Algorithm.ini.
;
; Delete a block to go back to inheriting.

[Surface.soft]

; Play the soft colour at all. Muted at render, so every arbitration decision stays identical and
; only the sound goes. Inherited from the [Surfaces] section until this surface has a block of its
; own.
bEnabled = 1

; The soft colour alone, summed on top of Surfaces:fTrimDb. Separately recorded sounds arrive at
; separate levels, and pulling the role trim to fix one takes every other floor with it. Inherited
; from the [Surfaces] section until this surface has a block of its own.
fTrimDb = 0

; When the soft colour arrives, relative to the contact frame. Close to the transient or it stops
; reading as the same event - but a hollow knock has a resonant delay that a brittle crack does
; not. Inherited from the [Surfaces] section until this surface has a block of its own.
fOffsetMs = 8

; How audible soft is on a light contact. Inherited from the [Surfaces] section until this surface
; has a block of its own.
fGainAtMinDb = -12

; And on a heavy one. The gap between the two is how much this material *changes* with force: wide
; for glass, nearly flat for carpet.soft
fGainAtMaxDb = -6

; Give the burst filler a soft colour as well. Nine of every ten contacts are taps, so this is
; where a floor gets identified rather than confirmed - but a splash on every one of them is
; absurd, which is why this is per-surface. Inherited from the [Surfaces] section until this
; surface has a block of its own.
bOnTaps = 1

; How audible soft is on a light scuff. The tap's offset and its headroom clamp stay in [Surfaces]
; - they describe the grain being coloured. Inherited from the [Surfaces] section until this
; surface has a block of its own.
fTapGainAtMinDb = -18.5

; And on a hard one. Inherited from the [Surfaces] section until this surface has a block of its
; own.
fTapGainAtMaxDb = -12.5


