; RagdollSounds_Algorithm_Surfaces.ini - one block per floor you have opened
;
; 0 of 13 surfaces have a block here. A surface with no block inherits from its
; parent - metal, glass and ice from stone; dirt, gravel, snow, water and body from
; soft; a puddle from water and bone from body - and a root with no block takes the
; [Surfaces] section of RagdollSounds_Algorithm.ini.
;
; Delete a block to go back to inheriting. Add one by hand - the section name is
; Surface.<name>, all lower case - or press + in the testbench's surface panel,
; which opens it holding whatever it was already inheriting.
; Written by Physical Ragdoll Sounds. Every key carries the comment that says
; what it changes perceptually; delete a key to go back to its default.

