; RagdollSounds_SFX.ini - which sfx each slot plays
;
; One section per slot. `Sfx` is a comma-separated list of filenames in the
; library folder beside this one - the engine picks between them with a shuffle
; bag, so a slot with three files does not repeat one twice in a row. The order
; is the variant index, so re-ordering the list changes which file a recorded
; cue plays; adding and removing is free.
;
; A slot left empty falls back to scanning for `<slot>_<NN>.wav` in sounds\,
; which is what the mod did before this file existed - so deleting a line here
; goes back to the shipped pack rather than to silence.
;
; `Muted` is a subset of `Sfx` that stays on the slot and never gets picked.
; The file keeps its place in the list, so it keeps its variant index and
; unmuting puts a recorded take back exactly as it was - which is the whole
; difference from deleting it from `Sfx`. A slot with every file muted goes
; silent rather than falling back to anything. It is by name, so a file
; listed twice on a slot is muted in both places - a mute is about the sound,
; not about one entry in the list.
;
; `Conditions` narrows when a file is a candidate: `file.wav : <surface> / <armour>`,
; comma-separated, where either half may be `any`. A tagged file wins over the
; plain ones when the contact matches, and is invisible when it does not - so
; `imp_body` can carry one recording made for plate on flagstone without that
; recording turning up anywhere else. Surfaces are soft, wood, stone, metal,
; water, body; armour is bare, cloth, light, heavy.
;
; A tag is about one entry in `Sfx`, not about the sound: the same file may be
; listed twice, once plain and once tagged, and then it is a candidate for
; everything *and* the preferred one where the tag matches. Where a name is
; listed more than once, `file.wav#2` says which entry is meant - counting from
; 1, in `Sfx` order. A bare name is the first entry of it.
;
; A condition is a preference, never a mute. If nothing on the slot satisfies
; one - a slot whose only file is tagged `stone`, on wood - the slot plays its
; full set rather than going silent. Use `Muted` to silence something.
;
; `Looping` says the slot's sound is a sustained texture the engine repeats
; whole rather than an event. Loops are judged as textures: they are never too
; long, and their seam matters instead of their attack.

; Bright, fast attack. The contact itself. The quietest layer of the stack
; impact - 60 to 120 ms, 3 expected
[imp_transient]
Sfx = imp_transient_01.wav, imp_transient_02.wav, imp_transient_03.wav
Muted = 
Conditions = 
Looping = 0

