; RagdollSounds.ini - general settings
; Written by Physical Ragdoll Sounds. Every key carries the comment that says
; what it changes perceptually; delete a key to go back to its default.


[General]

; Master switch. Off means the plugin loads, says so in the log and hooks nothing, so the mod can
; be disabled without uninstalling it.
bEnabled = 1

; info is the shipping level and is meant to be liberal - it should be enough to tell whether the
; mod ran and whether it heard the knockdown. debug is the per-contact firehose and will fill a
; log fast.
;   0=trace, 1=debug, 2=info, 3=warn, 4=error, 5=off
iLogLevel = 2

; Rotate the log on startup instead of truncating it, so the log from the session that crashed
; survives the next launch.
bEnableLogRotation = 1

; How many rotated logs to keep. 0 keeps all of them.
iMaxLogFiles = 5


[Suppression]

; Silences vanilla's own ragdoll body impacts so ours are the whole mix, wherever we are the ones
; playing the collision - an actor ragdolling, or in the get-up blend. Turn it off and every
; contact doubles, with half of it playing vanilla's dirt sample whatever the actual surface was.
bSuppressVanillaBodyImpacts = 1

; How far from a downed actor one of vanilla's body impacts still counts as theirs, in world
; units. The impact tells us where it happened and not who it was, so this is what matches the two
; up. Too small and part of a sprawled body doubles; too large and an NPC standing over the body
; loses their own. 150 is a little over two metres.
fSuppressionRadius = 150


[Audio]

; The sound output model every voice is opened with, in decimal. This is what gives a sound its
; distance falloff, its reverb send and its VR spatialisation; without one everything plays flat
; and follows you around the room. We add no reverb of our own, so this record's send is the whole
; of how wet we sound. 522252 (0x0007F80C) is SOMMono02000 - 150 to 2000 units at 30% send - and
; is the default; 930379 (0x000E324B) is the same range at 85%, which is what vanilla's own heavy
; body impacts use and is a long tail on a composite.
iOutputModelFormID = 522252

; The model taps are opened with instead, or 0 to give them the same one as everything else.
; Reverb send belongs to the record rather than to the voice, so this is the only way to say
; 'drier than an impact': 522252 (0x0007F80C) is SOMMono02000 at 30% send and 930379 (0x000E324B)
; is the same distance range wet at 85%, which is the dry/wet pair vanilla's own light and heavy
; body impacts use. It applies to a composite and not to a layer, so a tap's surface and armour
; colour follow the tap. 0 while the impacts are on the dry model themselves - there is nothing
; left for it to say until they move.
iTapOutputModelFormID = 0

; DirectInput scancode that plays one canned impact where you stand, for checking the mod can make
; a sound at all without needing to knock anybody over. 0 is off. 88 is F12.
iTestCueKey = 0


[Devbench]

; The testbench link. Off in a shipping install and deliberately so: it opens a loopback socket,
; streams every contact out of the process, and lets another program replace the algorithm config
; and the sound assignments while the game is running. With it off not a single socket call is
; made, and with it on a testbench that is not running is simply never found - the failure is
; always silent.
bEnableDevbench = 0

; Loopback TCP port the testbench listens on. Only ever 127.0.0.1 - nothing here is reachable from
; another machine. Change it only if something else on this box already wants 27860.
iDevbenchPort = 27860

; Where OBS Studio lives, so the testbench can start it when it is not already running. The game
; never launches anything; this key is here because the testbench reads the same file and there is
; nowhere else for it to be true. Empty means only drive an OBS that is already up.
sObsPath = 


[Benchmark]

; Time what the mod costs the frame it runs on, over the first few knockdowns of the session, and
; write the result to the log. It measures the three things the testbench's own benchmark cannot:
; publishing the ragdoll's limbs, the engine tick, and handing cues to the game's sound manager.
; Off in a shipping install - with it off no clock is read at all - and it reports once and then
; stops.
bEnabled = 0

; How many knockdowns to measure before reporting. Only frames inside a knockdown are sampled -
; from the frame after the first body goes down to the frame the last one is released. Idle frames
; are left out because the engine early-outs on them, and averaging thousands of those in would
; report a number that flatters the mod. What comes out is the cost of a busy frame, which is the
; only one that can miss a deadline.
iKnockdowns = 2

; A ceiling on frames sampled, so a ragdoll that never lets go cannot hold the report for ever. If
; it is hit the report still comes, and says it was cut short. 20000 is about three and a half
; minutes of continuous ragdoll at 90 Hz.
iMaxFrames = 20000

; Frames costing more than this many microseconds are counted separately, and that count is the
; line worth reading - a mean says what the mod costs and this says whether it ever spiked. 250 us
; is a fortieth of a 90 Hz frame: far above anything measured, far below anything anyone could
; feel.
fSlowFrameUs = 250

