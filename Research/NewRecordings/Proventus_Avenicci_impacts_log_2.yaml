# Quick Mod Menu NG - ragdoll impact recording metadata
# Everything about this take that the CSV does not carry on every row.

recording:
  file_index: 2
  csv: "Proventus_Avenicci_impacts_log_2.csv"
  note: "requested-capture repeat-2 (2/13): identical scripted knockdown, 2 of 3 - run-to-run variance"
  started_real: "2026-08-22T15:38:35"
  started_game_hour: 10.7311
  game_day: 18
  game_month: "Winter"
  game_year: 201
  min_impact_speed: 5.0   # game units/s - the CSV's floor
  tick_ms: 32
  units: "positions are game units; speeds are game units/second; angular speed is rad/s"
  columns:
    phase: "animated | ragdoll | getup | unknown - which side of the ragdoll
      handover the row is on, sampled by the tick, so it is accurate to one
      tick either side of a boundary"
    impact_speed: "the solver's own closing speed at the contact"
    normal_speed: "the same quantity recomputed from both bodies' motion; it
      should track impact_speed, and where it does not, tangent_speed beside
      it is not to be trusted either"
    tangent_speed: "relative speed along the surface at the contact point,
      including the spin term - a scrape rather than a thud"
    limb_radius: "the limb body's own bounding radius; full collider
      dimensions are in the bone dump"
    material_source: "shape | terrain | - - where other_material came from.
      Terrain has no material on the contact, so the land record under the
      actor stands in and says so"
    other_limb: "index into ragdoll.limbs when the thing hit was one of this
      actor's own limbs, otherwise -"
    manifold_first/manifold_last: "one manifold is the run of rows sharing
      (limb_index, other_body) between these two flags. manifold_first does
      NOT mark the strongest point of the manifold"
    dropped: "only on session_stop: how many events the ring threw away. Any
      number but 0 means the take is incomplete"

