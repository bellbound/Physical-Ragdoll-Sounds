obs:
  # video_time_ms = t_ms + offset_ms. offset_ms is the arm sample; sync_csv
  # carries the whole series, which is what to use for a long take.
  # This take is a stretch of a longer recording that was still running
  # when it closed. Both clocks below are that recording's, not a clip's:
  # subtract the clip's own start before using them against a cut file.
  external_recording: true
  output_path: ""
  sync_csv: "Proventus_Avenicci_impacts_log_9_sync.csv"
  offset_ms: 117981
  obs_version: "32.2.2"
