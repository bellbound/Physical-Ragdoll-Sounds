      value: 380
      keywords: ["ArmorLight", "ArmorMaterialLeather", "ArmorClothing", "ArmorCuirass", "VendorItemArmor", "MAG_LightArmorChest", "TNG_Covering"]
      covers_slots: [2, 4, 8]
