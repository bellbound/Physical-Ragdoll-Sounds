armour:
  # What each body site was wearing when the take started. `bones` names the
  # ragdoll limbs the slot covers, so a limb in the CSV can be matched to what
  # was on it.
  #
  # `slot` is where the item was equipped; `covers_slots` is where its armour
  # addons actually draw, which is what decides whether a forearm was metal or
  # skin. The `coverage` map below is the same information per body site.
  slots:
    - slot: 0
      site: "head"
      bones: "NPC Head [Head]"
      name: ""
      form: { id: "FE79C87A", editor_id: "RSV_SkinNakedDarkElf", plugin: "Racial Skin Variance - SPID.esp" }
      armour_type: "clothing"
      armour_rating: 0.00
      weight: 0.000
      value: 0
      keywords: ["TNG_Covering"]
      covers_slots: [0, 2, 3, 4, 5, 6, 7, 8, 10, 23, 28]
      covers_sites: ["head", "torso", "hands", "forearms", "feet", "calves", "tail"]
    - slot: 2
      site: "torso"
      bones: "NPC Spine [Spn0], NPC Spine1 [Spn1], NPC Spine2 [Spn2]"
      name: "[E] ZK Rogue Bodysuit"
      form: { id: "FE44CD6D", editor_id: "ZKRogue_Bodysuit", plugin: "[ELLE] ZK Rogue.esp" }
      armour_type: "light"
      armour_rating: 44.00
      weight: 5.000
      value: 400
      keywords: ["VendorItemArmor", "ArmorCuirass", "ArmorLight", "MAG_LightArmorChest", "TNG_Covering"]
      covers_slots: [2]
      covers_sites: ["torso"]
    - slot: 3
