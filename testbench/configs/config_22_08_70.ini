; RagdollSounds_Algorithm.ini - written by the testbench
; Written by Physical Ragdoll Sounds. Every key carries the comment that says
; what it changes perceptually; delete a key to go back to its default.


[Ingest]

; The quietest contact allowed to make any sound at all. Raise it and the small taps that fill out
; a tumble disappear; lower it and the settle at the end of a fall starts chattering.
fMinImpactSpeed = 20

; How far the floor above comes down for a contact that is sliding rather than arriving.
; 1.0 is off. The floor measures closing speed, and a body lying flat and skidding has almost none
; - so a clean slide is the thing it throws away most reliably, and the grind fades out as the
; slide gets purer. Lower this and those contacts are let in; too low and the settle at the end of
; a fall starts chattering again.
fSlideFloorFrac = 1

; Tangent speed at which the relief above is fully applied. It ramps in from the minimum impact
; speed, so a contact barely moving sideways keeps the full floor.
fSlideFloorAtTangent = 300

; How far the solver's closing speed and our own reconstruction of it may differ before the
; contact is treated as a physics explosion and thrown away. Lower is stricter: too low and real
; hard landings go silent.
fBlowupDisagreeFrac = 0.1

; Backstop for contacts with no reconstruction to check against. Anything faster is discarded as
; impossible, so setting it low makes the hardest hits in the game the only ones that never play.
fBlowupSpeedCeiling = 1000

; The same backstop for spin. A genuine armoured landing spins a limb to 60 rad/s, so anything
; near that discards real impacts.
fBlowupAngularCeiling = 200

; Half of all contacts are one limb touching another limb of the same body. Below this they only
; thicken the cloth bed; above it they play as real impacts. Drop it and a ragdoll rattles against
; itself constantly.
fSelfContactThreshold = 250

; Every limb-on-own-limb contact is reported twice, once from each limb. Off, they all play twice
; and the whole mix doubles at the moment of landing.
bDropMirroredSelfContacts = 1

; How large a gap between contact reports means a new frame started. Only matters on replay; the
; measured split is one microsecond inside a frame against 20 ms between.
fFrameGapMs = 2

; How often the game measures where every ragdoll limb is - 1 is every frame, 0 is never. This is
; the only measurement of where the body actually is; with it off, air time falls back to guessing
; flight from the gaps between contacts, which calls a body that has simply stopped touching
; anything airborne. Raise it only if a capture is getting unmanageably large.
iBodySampleEveryNTicks = 1

; One collision surface reported at several points becomes one contact at the strongest of them.
; Off, a flat landing on a floor plays several times over.
bCollapseManifolds = 1


[GlancingImpact]

; Judge a landing limb by how much of its motion went into the ground rather than past it. Off, a
; foot the body drops squarely onto and a foot that clips the floor on the way past sound the same
; at the same closing speed.
bEnabled = 1

; At or above this share of the limb's speed going into the surface, the landing is square and
; nothing is taken off. Measured: a foot the body lands squarely on reads 0.99, a knee taking part
; of a fall 0.74, a foot clipping the floor 0.58.
fFullTransferFrac = 0.9

; At or below this the reduction is at full. Between the two the ramp is linear. Set it close to
; the value above for a sharp switch, far below it for a gentle slope.
fNoTransferFrac = 0

; What fraction of its intensity a fully glancing landing keeps. Intensity carries the event's
; class and its rank, so low enough and the landing drops through the composite threshold and
; plays as a limb tap. One leaves intensity alone and uses only the level cut below.
fMaxIntensityScale = 0

; How much level a fully glancing landing loses before arbitration - so it is both quieter and
; ranked lower, and gives up the hero slot to whatever lands next. It does not change the cue's
; class; only the intensity scale above can do that.
fMaxGainCutDb = -13.5

; How much level a fully glancing landing loses, applied after arbitration - so it gets quieter
; and nothing else about the fall moves. This is the knob for separating a clipped landing from
; the hit after it without disturbing the rest.
fMaxTrimCutDb = -7.5

; Sideways speed over closing speed, above which the contact starts looking like a slide rather
; than a clipped landing and the reduction begins backing off. A clipped foot runs about 1.4; a
; body sliding along the floor runs 3 to 17.
fSlideRatioStart = 2

; Above this ratio the contact is a slide and the rule leaves it alone entirely. Without it a body
; sliding to a halt has every contact turned into a tap, which is not what a slide sounds like.
fSlideRatioFull = 4

; Whether the thigh counts as a landing limb beside the foot and the calf. Off, only feet and
; knees are judged and a hip skidding in stays at full level.
bIncludeThigh = 1

; Below this the limb is barely moving and the angle it arrives at means nothing, so the rule
; leaves it alone.
fMinBodySpeed = 60

; Whether a glancing landing must arrive proportionally faster to break a bone. Off by default: a
; bone can break at any angle, and the crunch is already quieter because the intensity behind its
; level fell. Turn it on if clipped landings crunch too readily.
bScaleCrunchGate = 0


[Motion]

; How long a body has to be off the ground before it counts as airborne, so one bounce does not
; read as a fall. Only used on a take with no pose data - with pose, the free-fall threshold below
; answers this properly.
fAirborneMinTimeMs = 120

; How hard the body has to be accelerating downward before nothing is considered to be holding it
; up, as a share of gravity. This is what tells a real fall from a body that has merely stopped
; touching anything - a shove pushes the body UP, and the old rule counted that as flying. Lower
; it and scuffs start reading as falls; raise it and only clean drops count. Needs a take with
; pose data.
fFreeFallFrac = 0.55

; Downward acceleration of an unsupported body, in game units. 686 is 9.8 m/s^2 at 69.99 units to
; the metre, and a real fall in the capture set measures 675. Only worth moving if a mod changes
; the world's gravity.
fGravityUnitsPerSec2 = 686

; How long the fall has to look like a fall before it is believed. Stops a single noisy solver
; frame opening a flight.
fFreeFallMinMs = 140

; And how long it survives a frame that disagrees, so a body clipping something on the way down
; does not land and take off a dozen times. It is also what keeps the flight readable on the frame
; the body lands, which is the frame the hero rule's arrival test needs it.
fFreeFallHoldMs = 60

; Whether a body something is pushing - a leash hauling on a collar, a shout, a blast, a spell
; that throws the target - is told apart from one that is only falling. On, air time is measured
; from the last frame something was pushing, so the rules that pay out for a long fall stop paying
; for a long pull. Off, the residual is still measured and reported so a gate can be chosen, but
; nothing acts on it and a powered flight reads as a fall exactly as it used to.
bDrivenDetect = 1

; How far the body's measured acceleration may sit from gravity before the flight counts as driven
; rather than falling. A leash hauling on a collar, a shout, a blast and a spell that throws the
; target all read the same way here, which is the point - the engine never has to know which mod
; did it. Air time is measured from the last driven frame, so a body that is being pulled has not
; been falling. Has no effect unless bDrivenDetect is on.
fDrivenResidual = 450

; How long a flight stays driven after the last frame that said so, so one quiet frame in the
; middle of a sustained pull does not hand the flight back.
fDrivenHoldMs = 80

; How long after a flight ends a contact still counts as its landing. The air-time rules ask about
; a fall that is over, and the flight flag has usually cleared by the time the arrival is judged -
; so this is what lets a landing be paid for the fall it ended instead of reading zero. Too long
; and a body lying still is still being paid for the fall that put it there.
fLandingWindowMs = 120

; How loud the moment of being knocked over is, before anything has landed.
fLaunchTrimDb = -6

; How many sounds the launch may spend at once.
iLaunchMaxCues = 2

; How loud anything is while the body is in the air. Should be well down: the airborne section is
; anticipation, not event.
fAirborneTrimDb = -9

; How many sounds may play while airborne.
iAirborneMaxCues = 1

; How loud the rolling section after the first landing is.
fTumbleTrimDb = -3

; How many grains a tumble burst may contain.
iTumbleMaxCues = 4


[Hero]

; Whether a fall is allowed a hero moment at all. Off, every budget comes from what the body is
; doing and a knockdown reads as a flat tumble throughout.
bEnabled = 1

; How hard a contact has to be before it can be a hero moment at all, as a share of the loudest
; thing the mod hears. This is the gate that stops an opening scuff stealing the moment from the
; landing forty contacts later. Raise it and only real slams qualify; drop it to nothing and the
; first touch of every fall is the hero.
fFloorFrac = 0.52

; How much louder than the last few hundred milliseconds a contact has to be to count as the event
; rather than as part of one. 1.0 makes every contact over the floor a hero; high values mean only
; a contact that dwarfs everything around it qualifies.
fDominanceRatio = 1.3

; The other way in: a contact that lands out of a genuinely measured flight this long is a landing
; whatever else is going on, however quiet the contacts around it were. Needs a take with pose
; data - on an old take this clause is simply off, because the old guess reads the first contact
; of a take as maximally airborne.
fArrivalMinAirMs = 250

; And how far it fell, in units, if you want short hops excluded. 70 units is about a metre. Zero
; judges on flight time alone.
fArrivalMinDropUnits = 0

; How long the hero moment stays open for its peers. A faceplant genuinely has a knee, a chest and
; a head arriving inside a couple of hundred milliseconds; shorten this and only the first of them
; is loud.
fWindowMs = 220

; How much bigger than the moment's own peak a later contact has to be to take the moment over -
; restarting the window, refilling the budget and moving the point every layer collapses to. This
; is what makes a landing one event that tracks its loudest grain, instead of one event followed
; by two it had no budget left for.
fReanchorRatio = 1.15

; The hero moment's own trim. This is the reference everything else is quieter than, so moving it
; moves the whole knockdown.
fTrimDb = 0

; How many grains the hero burst may contain. The references measure three to five.
iMaxCues = 4

; Whether opening a hero moment closes whatever burst was already running and starts its own with
; the grain count back at zero. On, because the thing a long fall most often loses to is not a
; gate but a burst that some scuff opened and filled while the body was still in the air.
bResetsBurst = 1

; How much of the enforced silence between bursts a hero moment is excused, so the landing is not
; dropped for arriving too soon after the burst it just closed. 1.0 waives it entirely, 0 waives
; nothing.
fBurstGapFrac = 0.15

; How long a burst stays open while a moment is running. 0 uses the ordinary burst window, which
; is what happened before this existed.
;
; The two want opposite things and that is the whole reason this is a second number. An ordinary
; burst wants a wide window - contacts arrive when the solver reports them, and a window shorter
; than a fall's own spread shuts before the loud one lands, which is how two taps at 0.03 and 0.07
; intensity spend a burst and lock out the 465 u/s hit seventy milliseconds behind it. A hero
; burst wants a tight one: the grains of a landing are already together because the limbs arrive
; together, so the window's job there is not to wait for them but to shut before whatever comes
; next joins in and smears the crash into a roll.
;
; Three or four grains inside 20-40 ms and then several hundred milliseconds of nothing is the
; reference rhythm - the same picture `Waive the rate cap` is drawn from.
fBurstWindowMs = 270

; How much of the minimum spacing between onsets is waived inside a hero moment, so its peers
; cluster instead of being spaced like ordinary contacts. This is the shape of a landing: evenly
; spaced onsets read as a metronome, three or four inside 20-40 ms then a long gap reads as a
; crash. Too near 1.0 and simultaneous onsets stop clustering and start summing - the peak doubles
; and the mix is no denser.
fRateCapFrac = 0.75

; How many hero moments one knockdown may have. 0 is unlimited, which is the point: a body
; bouncing down a staircase has more than one real landing in it. Set it to 1 for the old
; behaviour of one hero per fall.
iMaxPerEvent = 0


[Arbitration]

; The shortest gap allowed between any two impact onsets, whatever limb they came from. Below
; about 46 ms extra onsets stop adding detail and start adding mud; well above it a knockdown
; starts to sound sparse and deliberate.
fRateCapMs = 43

; How much louder than the impact holding the rate cap a new one must be to get through anyway.
; Lower lets a busy crash keep more of its hits; raise it towards 60 to switch the override off
; and let the cap always win.
fRateCapOverrideDb = 16

; How long one limb chain stays claimed by its strongest contact. This is what turns a hand, a
; wrist and an elbow landing together into one arm flop.
fChainMergeWindowMs = 60

; How far under the loudest recent sound a proposal has to be before it is dropped outright rather
; than played quietly. Small values let everything through and the landing turns to porridge;
; large values leave only the heroes.
fMaskDropBelowDb = 12

; How fast the ear is assumed to recover after a loud hit. Slower means a big landing keeps the
; following second quiet.
fMaskDecayDbPerSec = 60

; How many sounds one audible moment is built from. The references measure three to five; more
; reads as a machine gun rather than as an impact with texture.
iBurstMaxGrains = 5

; How long one burst may last before it has to end. This plus the grain count is the shape of an
; audible moment.
fBurstWindowMs = 110

; The silence enforced between audible moments. This is the single biggest lever on whether a
; three-second tumble reads as four events or as thirty.
fBurstMinGapMs = 300

; During a hero moment, place every layer at one point. Several points read as several events; one
; point reads as one event with detail.
bSpatialCollapseOnHero = 0

; How long the collapse holds before the sound spreads back out across the limbs for the tumble.
fSpatialCollapseWindowMs = 200

; How many frames every window is worth as well as its millisecond floor, so the system behaves
; the same at 24 fps and at 144. Zero pins every window to its floor and makes the mod frame-rate
; dependent.
fFrameScaleK = 2

; Rank only, never loudness: how much of a head start a spine, COM or neck contact gets when the
; arbitrator decides which of a frame's contacts survives. Nobody hears this - they hear which
; contact was kept. At 3 dB a torso landing beside a slightly harder hand wins, and a hand 6 dB
; louder still wins. Zero is off.
fTorsoWeightDb = 4.5

; The same head start for a skull contact. Rank only. The hero test already has a partial one of
; these in HeadImpact:bHeroFloorRelief, so raise one or the other rather than both blind.
fHeadWeightDb = 2.5

; The same head start for arms, legs and anything off a skeleton we could not read. Only the
; differences between the three matter, so leaving this at zero and raising the other two says the
; same thing as raising this and more.
fLimbWeightDb = 0


[Intensity]

; The contact speed that maps to the bottom of the loudness range. Anything at or under it is as
; quiet as the mod goes.
fSpeedRefLow = 20

; The contact speed that maps to full level. A guess, not a measurement: the take that would have
; established it was discarded. Lower it and ordinary knockdowns get loud; raise it and nothing
; ever reaches the top of the range.
fSpeedRefHigh = 510

; The whole span from the quietest contact to the loudest, in decibels. The references use about
; 35; a naive loudness curve gives 60 and sounds wrong at both ends - shouty at the top, inaudible
; at the bottom.
fDynamicRangeDb = 35

; Where the loudness sits between the two anchors. Under 1 fills the middle out and makes ordinary
; contacts more present; over 1 keeps everything quiet until it is genuinely hard.
fCurveExponent = 1.2

; Where the curve stops being straight and starts compressing, so another mod's absurd impulse
; gets loud rather than rejected. A silent obliterate is the worst possible outcome.
fSoftClipKnee = 0.25

; How much a limb's own size makes it louder. At zero a fingertip and a torso at the same speed
; sound identical; high values make torso landings dominate everything.
fMassWeight = 0.9

; The same, from the limb's physical bounding radius rather than its mass. This is the half that
; still works on a skeleton we do not recognise.
fRadiusWeight = 2

; Where a contact stops being a fall and the gore tier opens, as a multiple of the loud anchor.
; Above 1 is above anything the mod treats as loud, which is where it belongs; under 1 and
; ordinary hard landings start coming apart.
fObliterateFrac = 5.9


[PostIntensity]

; Widens or narrows the gap between the quietest contact and the loudest, after every layer has
; been chosen. Unlike the dynamic range above it moves loudness only - the same contact is still
; built from the same layers at the same pitch.
fExtraRangeDb = -27.5

; Where the level sits between the two anchors, on top of the curve above. Under 1 brings ordinary
; contacts forward without giving them a heavier stack; over 1 holds them back without making them
; thinner. 1 changes nothing.
fCurveExponent = 2.4

; Compresses the top of the level range so an absurd impulse gets loud rather than enormous, while
; still being built as the obliterate it is. 1 is off.
fSoftClipKnee = 1


[SlotGain]

; The bright contact click, on its own. The one to reach for when the attack reads as a tick
; rather than as a hit.
fImpTransient = 8.5

; The low-mid flesh and mass. Carries most of what a body sounds like, so a decibel here is
; audible on every impact in the mod. The torso's, and the head's.
fImpBody = 0

; The same layer out on an arm or a leg. Until somebody records imp_body_limb_01.wav this trims
; the imp_body file the limb composite falls back to - which is the useful half of it early: it
; sits every limb impact back without touching the torso's.
fImpBodyLimb = 0

; The late pitched boom - the loudest layer and the whole of the gnarl. Down a couple of decibels
; if the mod is booming through a soundbar.
fImpSub = -0

; The burst filler. Quiet and dry by design: lift it and a tumble turns busy, drop it and the gaps
; between the real impacts open up.
fLimbTap = -3

; The granular bone break. Loud enough to be a fact about what happened, not so loud that it
; becomes the impact.
fCrunchGran = 0

; The column going. Falls back to crunch_gran until somebody records one, and this trim is what
; balances the two against each other when they do.
fSpineCrunch = 0

; One bone out on a limb. The most-heard of the three by a distance, because limb contacts
; outnumber the other two several times over - so it is the one to pull down first if the mod
; starts sounding like a bag of sticks.
fLimbCrunch = 0

; The squelch, the top damage tier. It plays rarely enough that it is easy to leave far too hot
; without ever noticing.
fGoreWet = 0

; One catch mid-slide. Sparse by design, so it is easy to leave hot without noticing until a long
; skid fires a dozen of them.
fScrapeGrain = 0

; The body grind, and its surface variants, which share this trim because they are the same layer
; on a different floor. Sits about 20 dB under the impacts; if it reads as a hiss rather than as a
; rumble the file is wrong, not the gain.
fScrapeLoop = 0

; The light grind of one limb dragging, and its surface variants. Well under the body grind - a
; single foot should be only just audible at conversational distance.
fScrapeLimb = 0

; The airborne rise. Anticipation, not event - lift it and every knockdown announces itself before
; it has landed.
fAirWhoosh = 0

; The skull accent. Rare and unmissable is the brief, and it rides on a full composite already, so
; it needs less than it looks like it does.
fHeadImpact = 0

; The closing flop. Quiet enough to read as a full stop rather than as one more impact.
fSettleRest = 0


[Limbs]

; Off, how loud an impact is depends on which limb touched - and a foot is quiet even when the
; whole body lands on it. On, it depends on how much of the body is actually arriving, judged by
; how much the limb is travelling rather than swinging.
bMassDeterminesLoudness = 1

; How loud a landing that brings the whole body with it is, on the same scale as the limb table (a
; foot is 1, a thigh 7, the trunk 7.5). Every fully coupled contact uses this whatever limb it
; came through, which is what makes a feet-first and a hip-first landing at the same speed sound
; alike.
fBodyMass = 3.5

; How much spin counts as a limb swinging on its own rather than being carried. Lower and more
; contacts are treated as flails and go quiet; higher and even a whipping arm is priced as the
; body landing.
fRotationRefRatio = 1.1

; How far towards the whole-body mass a coupled contact is allowed to go. At 0 the toggle above
; does nothing; at 1 a body landing is priced entirely as a body.
fCouplingWeight = 1

; A limb moving slower than this delivers nothing however straight its path is. Stops a body
; settling slowly onto the floor being priced as a landing.
fMinBodySpeed = 120


[ImpactComposite]

; The core layer stack. Off, the mod plays only accents and loops and every impact loses its body.
bEnabled = 1

; Under this intensity a contact plays as a single tap instead of a four-layer composite. It is
; the only place a level decision changes a cue's class, so it is the line a reduction has to
; cross before a landing stops being a hero moment. Raise it and more of a tumble becomes texture.
fTapBelowIntensity = 0.15

; When the bright contact click lands. This is the reference everything else is measured from and
; should stay at zero.
fTransientOffsetMs = 0

; When the low-mid flesh and mass arrives. Measured at 8-34 ms in the references.
fBodyOffsetMs = 20

; When the pitched boom arrives. The single most important number in the mod: at 65 ms an impact
; reads as mass, at 0 it reads as a click with a thud stuck to it, and past 120 ms it stops
; belonging to the impact at all.
fSubOffsetMs = 65

; A few milliseconds of variation on each layer so no two composites have exactly the same
; envelope. Large values smear the shape instead of varying it.
fOffsetScatterMs = 4

; How much of the stack is the bright click on the lightest contact. Light contacts are almost all
; transient.
fTransientGainAtMinDb = -5

; And on the heaviest, where it only rides on top of the sub.
fTransientGainAtMaxDb = -18

; How much flesh a light contact has.
fBodyGainAtMinDb = -8

; And a heavy one.
fBodyGainAtMaxDb = -2

; How much boom a light tap gets. Should be almost none, or every tap sounds like a cannon.
fSubGainAtMinDb = -25

; And a hard landing, where it is the loudest thing in the stack. This is where the gnarl comes
; from.
fSubGainAtMaxDb = 0

; Random pitch spread per voice. This is what stops thirteen files sounding like thirteen files.
; Past about three semitones it starts sounding like a pitch trick.
fPitchScatterSemis = 2.5

; How far down a heavy impact is pitched relative to a light one. Negative reads as heavier and
; bigger for free.
fPitchIntensityBiasSemis = -3

; The hard limit on the two above put together, so nothing ever sounds obviously transposed.
fPitchMaxSemis = 3


[Surfaces]

; Off, nothing gets a surface skin and the mod plays the same body on marble as on moss. The
; fastest way to hear how much of the mix is the floor at all - the three mutes at the bottom
; answer the same question one surface at a time.
bEnabled = 1

; When the wood, stone or soft colour arrives on a four-layer impact. Close to the transient, or
; it stops reading as the same event.
fOffsetMs = 8

; How audible the surface colour is on a light contact.
fGainAtMinDb = -12

; And on a heavy one. If the surface reads as a separate sound rather than as colour, it is too
; loud.
fGainAtMaxDb = -6

; Give the burst filler a surface skin as well. Nine of every ten contacts are taps, so with this
; off a body sliding down a wooden staircase spends nine tenths of itself sounding like a fall
; down nothing in particular. Scuffs are where a floor is identified; the hero hits only confirm
; it.
bOnTaps = 0

; Tighter than the impact offset on purpose. A tap is 40-100 ms of grain, so a skin arriving late
; would outlive what it is colouring.
fTapOffsetMs = 4

; How much floor a light scuff names. Low: this plays on most of the contacts in a take, so a
; decibel here is a decibel everywhere.
fTapGainAtMinDb = -12

; And on the hardest thing still classed as a tap - a fast graze along the floor, which is exactly
; where a surface should be at its most obvious.
fTapGainAtMaxDb = 12

; How far under its own tap the colour is held, whatever the ramp above says. This is
; colour-not-dominate written down: 0 lets the skin tie with the grain it is colouring and there
; is nothing above 0. The tap is still ranked on the tap alone, so this changes what is heard
; rather than what is chosen.
fTapHeadroomDb = -3

; Global trim on the wood, stone and soft colour together. Up makes the floor material obvious;
; down makes every surface sound the same, which is what vanilla does.
fTrimDb = -4

; The hollow knock, alone. Wood is the surface most likely to arrive louder than the other two,
; because a hollow knock is easy to record hot.
fWoodTrimDb = 0

; The hard short skin, alone. Short files read quiet at the same peak, so this is usually the one
; that needs lifting.
fStoneTrimDb = 0

; The dull skin, and the one anything unresolved falls back to - so it plays far more often than
; the other two and is worth setting last.
fSoftTrimDb = 0

; The hollow knock layered on when a body lands on wood. Muted at render, so every arbitration
; decision stays identical and only the sound goes.
bWood = 1

; The hard, short skin for stone. Vanilla plays the same dirt sample for stone, ice and carpet
; alike, so this is one of the differences the mod exists to make.
bStone = 1

; The dull skin, and the fallback for every surface we cannot resolve - which today means all
; natural ground, since no dirt, grass or snow contact exists in the capture set.
bSoft = 1


[Armor]

; Off, no cue gets an armour skin and the class is not even read. The fastest way to hear how much
; of the mix is what the body was wearing - the four mutes at the bottom answer the same question
; one class at a time.
bEnabled = 1

; On, each contact is coloured by what that limb is wearing: heavy boots on an otherwise naked
; body give feet the plate rattle and everything else the skin slap. Off, every contact reads the
; cuirass instead and the whole body clanks together. The fast A/B for whether per-limb is worth
; having at all.
bPerLimb = 1

; A site with nothing in its own armour slot reads as whatever the chest piece is, rather than as
; bare. Right for the common case - a cuirass with no separate gauntlets does not mean bare
; forearms - and wrong for heavy boots on a naked body, where you want the rest to read naked.
; Off, an empty slot means bare.
bInheritFromBody = 1

; A worn item with no name and no weight is treated as bare rather than as clothing. TNG's skin is
; a real armour record covering five slots, so without this a naked modded body reads as clothed
; on five sites and armor_bare essentially never fires. The recording loader has always applied
; this rule; this is the live path catching up.
bBareIsNaked = 1

; The airborne rise has no contact and therefore no limb to read a class off. 0 uses the cuirass -
; what you hear moving on a body in flight - 1 uses the last contact's limb, 2 reports them as
; unclassified, which is the clothing class: it is defined as clothing and anything we cannot
; decide, so it is the value that asserts nothing.
iActorClassSource = 0

; Suppress the head accent when the head is in light armour. It takes away the accent only - the
; dull skull thud with the ring on it, which reads as bare skull and is wrong under a helm. The
; composite, both skins and the crunch all still fire, so a helmeted head landing hard is still
; loud; it just stops sounding like a melon.
bNoHeadOnLight = 0

; The same for a full helm. Independent of the light switch, because a padded coif and a steel
; helm are not the same argument.
bNoHeadOnHeavy = 0

; When the rattle arrives on a four-layer impact. Between the transient and the body on purpose:
; metal moves because something stopped, so it is a consequence of the contact rather than the
; contact itself. At 0 it fuses with the transient into one brighter click, which is the failure
; mode to listen for.
fOffsetMs = 12

; How audible the armour is on a light contact.
fGainAtMinDb = -14

; And on a heavy one. If the armour reads as a separate sound rather than as colour, it is too
; loud.
