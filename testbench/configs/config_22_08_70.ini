; arrive in decide which layer you hear, and a crunch that was proposed and then dropped spends
; the budget anyway.
iLimbGoreBudget = 1

; The shortest gap between two of these. 0, the default, is off. The finer control of the two and
; the one to reach for first: any value at all stops one sprawl arriving as a burst of breaking
; sticks without capping what a long tumble may add up to.
fLimbGoreSpacingMs = 0


[Slide]

; The grinding loops for a body dragging along a surface, and the catches riding on them. Off, a
; slide still happens - the state, the impact budget and the slide-end lift are all still there -
; it simply makes no sound of its own.
bEnabled = 1

; How fast a body has to be travelling along the ground before the slide state opens and the
; grinding loops are allowed.
fSlideMinTangentSpeed = 50

; And for how long, so a single glancing blow does not read as a slide.
fSlideMinDurationMs = 180

; Or how far the body has to have travelled, if it gets there before the duration above. A fast
; skid crosses two metres in a few frames; without this only slow grinding ever counted as a
; slide.
fSlideMinDistance = 0

; How long the grazing may stop before the slide is over. This does not decide *how* it ended -
; the body does that, and the two ways out are coming to rest and going airborne - only that it
; has. Short, and a couple of quiet frames in a long grind break it into pieces; long, and the
; grind carries on past the moment the body was stopped.
fSlideGraceMs = 140

; The exit speed, and the counterpart to the slide speed above - that one opens a slide and is
; asked of the contacts, this one keeps it and is asked of the body.
;
; Over this, the slide outlives its own grazes: the collision stream going quiet while the corpse
; is still travelling is the solver taking a breath, not the slide ending, and the grind should
; not stop with the body still moving. Under it, the slide grace above has the last word exactly
; as before.
;
; Set it under the slide speed and the pair is hysteresis - it takes real rubbing to start a grind
; and rather less to keep one. Zero is off. Needs a take with pose: without it the only speed
; available is the decaying contact hold, and holding a slide on that ends it on its own decay
; curve rather than on the body.
fSlideHoldSpeed = 0

; The longest a slide may be held on speed alone with nothing touching, counted from the last
; graze. The body slowing down is what ends the hold in every honest case; this is the bound for a
; pose stream that says a body is drifting when nothing is in contact with it. It never shortens
; an ordinary slide - one with grazes in it never reaches this timer.
fSlideHoldMaxMs = 2000

; How much faster a contact must be sliding along a surface than into it before it counts as
; rubbing rather than hitting. This is the first decision a slide is made of: it is what feeds the
; scrape path, and about half of all worthwhile contacts in a tumble currently land on this side
; of it, which the mod's own notes flag as untested.
fGrazeRatio = 1.5

; Above this closing speed a contact is always a thud, however much it is also sliding. Raise it
; and hard skids go quiet as the scrape path swallows them; lower it and genuine slides start
; thudding.
fGrazeMaxImpactSpeed = 220

; Whether a running slide hands its harder contacts back to the impact path instead of spending
; them as scrape.
; Off, a grind owns every rub under it, which is what keeps a skid from thudding on every frame.
; On, the slider below draws the line and anything over it is built as an impact as well as being
; ground.
; A rub with no slide running under it always reaches the impact path and never had a switch worth
; keeping: claiming those was deleting about half of every knockdown's contacts and playing
; nothing in their place.
bSlidesDontClaim = 1

; Where the line above sits: under this intensity the slide keeps the contact, at or over it the
; impact path gets it too.
; Does nothing unless 'Slides dont claim' is on. Raise it and the grind keeps more - at 1.0 it
; keeps everything and the switch above stops meaning anything. Lower it and the heavy contacts of
; a grind - a spine or a thigh coming down at 0.3-0.5 intensity while the body slides - stop being
; spent as scrape grains and get built as impacts. Too low and a genuine skid starts thudding on
; every frame, which is what the scrape path exists to prevent.
fClaimBelowIntensity = 0

; How loud the impacts during a slide are. The grinding loops have their own levels.
fSlideTrimDb = -6

; How many one-shots may punctuate a slide. This is the budget the catches below are paid for out
; of.
iSlideMaxCues = 2

; How gently a grind arrives. Too short and it clicks in at the start of a slide. The fades' job
; is to hide the transition rather than to shape the level, which is the speed's.
fStartFadeMs = 65

; How gently it leaves when the slide ends on the ground. Short, because a body grinding to a halt
; does not fade - it slows down, and the level already tracks how fast it is going, so a long fade
; here is a second ending laid over the real one.
fStopFadeMs = 70

; And how gently it leaves when the slide ended because the body went airborne, which is faster:
; the surface is simply gone.
fLaunchFadeMs = 45

; The heavy, full-weight grind: falling at a run and skidding several metres, or being dragged
; flat on your back. It runs alongside the limb grinds rather than instead of them, and the two
; cross-fade on how much of the body is touching.
bBodyEnabled = 1

; How loud the body grind sits under the impacts at full speed and full weight. The references put
; a slide 15-25 dB under them.
fGainDb = -16

; The body speed the grind is quietest at - and, at or under it, stops. Level and pitch track the
; measured centre of mass, so a slide is exactly as loud as the body is fast, and at the bottom of
; that ramp there is nothing left to be quiet about.
;
; This is what ends a grind that has run out of speed. It used to be the mix's voice floor doing
; that job, which only worked while the gains happened to put the bottom of the ramp a decibel
; under it - move the body level or the floor and the grind ran on at its quietest for as long as
; the slide lasted, at one unchanging level. At 0 there is no bottom to reach until the body has
; completely stopped, which is that same behaviour asked for on purpose.
fSpeedForMinGain = 10

; And the speed it reaches full level at, so the grind tracks the slide rather than sitting at one
; level throughout.
fSpeedForMaxGain = 380

; How far under its level the grind sits at the quiet end - the depth of the speed dependence. At
; 0 the slide is one level whatever it is doing; deep enough that a crawl is inaudible is what
; keeps a body settling on its side from sounding like it is being dragged.
fSpeedRangeDb = -13.5

; How much faster the grind plays as the slide speeds up, per thousand units/s of measured body
; speed. A little sells the acceleration; a lot sounds like a tape being spooled.
fPitchPerThousandUnits = 0.25

; Hang the body grind on the bone nearest where the body is actually touching, rather than on the
; actor's root - which is roughly the pelvis, and is not where the sound is even for a real
; full-body slide. Nearest-to-contact rather than lowest on purpose: a body can grind along a
; wall, down a staircase or across a ceiling, and a rule that assumes the floor is below gets all
; three wrong. Still one single point, so nothing smears.
bBodyFollowsContact = 1

; Add up the anatomical weight of the limbs that are actually rubbing and let that decide how much
; body grind there is.
; This is the fix for "it fires on almost nothing and then plays at full body volume". Nothing in
; the mod ever measured how much of the body was touching, so the level stood on speed alone and a
; corpse dragged by one ankle read exactly as loud as the same corpse lying flat. One foot is
; about 1.5 % of a body; both feet and both shins about 13 %; flat on your back and skidding is 60
; % and up. Off, the level is speed alone again, which is the old behaviour.
bFractionEnabled = 1

; The share of the body that has to be touching before the body grind plays at all. Below this the
; limb grinds are the whole of the slide.
fBodyFracStart = 0.3

; And the share at which it is at full weight.
fBodyFracFull = 0.55

; How far under its level the body grind sits at the bottom of that ramp. Deep, because just over
; the threshold it should be barely there - crossing it must not be an event in itself.
fBodyFracRangeDb = -15

; How long a limb goes on counting as touching after its last rub. Contacts are dense when a fall
; is busy and absent when it is not, so without a hold the measurement flickers at solver rate and
; the grind comes out as a tremolo.
fContactHoldMs = 400

; The light, dry grind of one limb dragging: a foot, a trailing hand, a forearm. One per limb -
; two arms, two legs and the head - so several limbs scraping at once are several sounds, each on
; its own bone. The torso has none, because a spine on the floor is the body sliding and that is
; the body grind's subject.
bLimbEnabled = 1

; How many of the five may run together, given to whichever limbs are rubbing hardest. Purely a
; judgement about the mix - a voice costs nothing the engine cannot afford - and the default is
; under five because five limbs grinding at once is more sound than the picture supports.
iMaxLimbLoops = 3

; How hard a limb has to be rubbing before it gets a grind of its own.
fLimbMinTangentSpeed = 100

; How loud one limb dragging is. A single foot should be only just audible at conversational
; distance - closer to the cloth bed than to the body grind - and it is easy to overshoot here,
; where you are listening for it deliberately.
fLimbGainDb = -22

; The limb grind's own speed response, measured on how fast that limb is rubbing rather than on
; the body - a dragging foot behind a body that has otherwise stopped is still a dragging foot.
fLimbSpeedForMinGain = 10

; And the rubbing speed it reaches full level at.
fLimbSpeedForMaxGain = 190

; The depth of that dependence, as for the body grind.
fLimbSpeedRangeDb = -12

; How much faster a limb grind plays as the limb speeds up. A small contact patch reads its speed
; more in pitch than a whole body does, so this can sit above the body's.
fLimbPitchPerThousandUnits = 0.22

; Play a limb grind from the limb that is making it. Off, it collapses onto the body the way every
; loop used to - which is what put your own scrape inside your head, since the player's ragdoll is
; at arm's length and a collapse to one point there is not spatial at all.
bLimbFollowsLimb = 1

; How long a different bone in the same limb has to be the one rubbing before the grind moves onto
; it. This is what stops a scrape smearing as the contact hops from forearm to hand and back frame
; by frame; short and it wanders, long and it lags behind what you can see.
fLimbHoldMs = 200

; A skull dragging is a small contact patch, so it plays the limb file rather than the body one -
; but it is a skull. Rather than a whole extra sound, the head's grind is the same file pitched
; down a little with its own trim, which is the same trick the head impact uses to earn its
; character. Off, the head grinds exactly like an arm.
bHeadTint = 1

; How far down. 1 is no tint at all.
fHeadPitchScale = 0.9

; And what the head grind is worth against the other limbs.
fHeadGainDb = -2

; Pull the limb grinds down under the body grind as it comes in. Both play together by design, but
; a full-weight slide with four limb grinds still going on top of it is more sound than the
; picture supports. Scaled by the body grind's own weight, so it arrives with the body rather than
; switching on.
bBodyDucksLimbs = 0

; How far down, at full body weight. Deep enough is suppression rather than damping: a limb grind
; ducked under the mix's own voice floor is stopped outright and gives its voice back, so this one
; slider covers both.
fLimbDuckDb = -9

; Fire a short scrape grain on the moments a limb catches on something.
; This is the single biggest thing between a slide and a noise file. A real body sliding on stone
; carries sixty-five little grit peaks a second riding on the rumble, and the loop has the rumble
; and none of the grit; a slide's whole character is its irregularity. Each catch is a contact the
; solver really reported and the mod was throwing away - nothing here is invented.
bGrainEnabled = 0

; How loud a catch is against the contact it came from.
fGrainGainDb = -14

; How much harder than the slide has been grinding lately a contact has to be to count as a catch.
; At 1 every rub is one, which is a rattle rather than a texture.
fGrainCatchRatio = 1.5

; The floor under how often one may fire.
fGrainMinGapMs = 80

; And the chance one does when it is allowed to. Both, because a gate that is only a rate limiter
; turns a dense stream into a metronome.
fGrainProbability = 0.6

; How far either way a catch's pitch is thrown. Catches all at one pitch read as a single sample
; repeating, which is the thing this layer exists to stop.
fGrainPitchScatter = 0.18

; How much of the contact's own speed is blended into the level's.
; The body's speed is smooth by nature, so a level that follows it alone reads as a constant
; however correct it is. Contact speed is genuinely spiky, because limbs load and unload as a body
; tumbles, and a little of it makes the grind breathe. A wobble around the body speed and never a
; replacement for it: the level used to be driven purely by contact speed, which is the speed of a
; limb rather than of a body, and that was wrong. 0 is the pure body speed.
fContactSpeedBlend = 0.25

; How far the level has to move before a running grind is told about it. The shared figure is
; three-quarters of a decibel, which is most of what a breathing grind does - the loop was being
; held flat by the thing meant to keep the cue list readable.
fLevelDeadbandDb = 0.25

; Let the grinds pick a file for the floor they are on - stone, wood, or the default for
; everything else. Off, everything plays the default grind, which is what the mod did on
; flagstone, floorboards, dirt, snow and ice alike. A surface with no recording behind it falls
; back to the default anyway, so this costs nothing until the files exist.
bSurfaceVariants = 1


[MotionFoley]

; The airborne anticipation whoosh. This section used to own a continuous cloth bed as well; it
; was muted in every saved config and went with its slot.
bEnabled = 1

; The anticipation whoosh while a body is in the air. On by default at a low level: it tells the
; ear something is about to land.
bAirborneRise = 1

; How loud the whoosh is. It should be felt rather than heard.
fAirborneRiseGainDb = -24


[Damage]

; Let how violent the fall has been move all six tiers, on top of how hard the contact itself was.
; A medium knock on a body that has been cartwheeling down a staircase breaks something more
; readily than the same knock on a body that was lying still. Off by default and off changes
; nothing; the amounts below are already set to a usable voicing.
bViolenceEnabled = 1

; How long a violent stretch is remembered. Long enough to bridge the gaps between the bounces of
; a staircase, short enough that a fall which has settled is judged as settled. It is measured
; only between collisions - a contact cannot raise it, or every impact would be evidence of its
; own violence.
fViolenceHoldMs = 210

; How much of the answer is this limb rather than the whole body. 0 asks only how bad the fall is;
; 1 asks only how hard this particular arm is being whipped about. They come apart - a body
; sliding to a stop with one leg still cartwheeling is quiet on the first and loud on the second.
fViolenceLimbShare = 0.5

; How far a violent fall lowers each tier's threshold, as a fraction of that tier's own span. The
; aggressive half of occurrence: it admits weaker contacts, so it can put a crunch on a knock that
; would never have earned one. What comes through the lowered bar still arrives at the quiet end
; of the level ramp.
fViolenceGateDropFrac = 0.35

; How much more often an already-eligible contact fires. DEAD at the shipped defaults: all six
; tiers fire with certainty once past their gate, so there is no room above to add. Pull a tier's
; 'chance at gate' below 1 and this comes alive.
fViolenceChanceBonus = 0.65

; Extra breaks a violent fall is allowed, on top of each tier's own budget. **The lever that
; actually moves how often you hear one**: measured on the corpus these tiers are budget-limited
; rather than threshold-limited, so lowering the gate admits contacts into a ledger that is
; usually already spent. Measured over the corpus: the gate drop alone is +3% more breaks, this
; alone is +5%, and the two together at 3 are +22%. Still a budget, so even the worst tumble
; cannot machine-gun it.
iViolenceBudgetBonus = 16

; How far the gap between two breaks shrinks when the fall is violent. DEAD at the shipped
; defaults: every tier ships with no spacing at all, and scaling zero is zero. Set a tier's
; spacing and this starts tightening it.
fViolenceSpacingScale = 0.6

; How much louder a break is when the fall is violent. A tier is discrete - a bone either broke or
; it did not - so this only pushes a break that was already happening further forward, and never
; softens one into existence.
fViolenceLevelBonusDb = 12


[Rustle]

; The garment: a continuous fabric and armour layer riding a knockdown, loudest while the limbs
; are thrashing and the body is turning over. Off by default, and off changes nothing at all -
; nothing is measured and no cue is emitted. Every slider under it is already set to a usable
; voicing, so this switch is the whole of turning it on.
bEnabled = 1

; How much of the level comes from the limbs accelerating relative to the body. This is the signal
; - and the reason the layer is not driven off the body's own acceleration, which barely moves
; between the treads of a staircase while the limbs are being flung about.
fThrashWeight = 1

; Relative limb acceleration, u/s2, below which there is no rustle at all. The number that keeps a
; body lying still silent, and the first one to set by ear.
fThrashFloor = 500

; Where the thrash term reads maximum. Set it near a tumble's typical peak, not near an impact's:
; a limb landing measured 5110 u/s2, and a range stretched to hold one flattens the whole tumble
; to nothing.
fThrashFull = 3940

; How much of the level comes from the limbs rotating. A limb spinning at a steady rate drags its
; sleeve continuously with no acceleration at all, which is what a fall down stairs is mostly made
; of - so this cannot be folded into the thrash.
fTumbleWeight = 0.8

; Limb surface speed from rotation, u/s, below which rotation contributes nothing.
fTumbleFloor = 40

; Where the rotation term reads maximum.
fTumbleFull = 400

; Per-limb clamp on acceleration before the sum. Guards against a solver blow-up making the layer
; scream, and does the ordinary job too: one limb hitting stone is held to something sane while
; the rest contribute their real motion, so an impact lifts the level instead of pinning it.
fThrashCeiling = 10000

; Subtract the body's own acceleration from each limb's. On is right - fabric moves when a limb
; moves relative to the body it is on, and everything on a falling body accelerates together. Off
; is the naive version, kept so the difference is audible.
bRelativeToBody = 1

; How much a fast body multiplies everything above. A multiplier and never an addend: the same
; thrash at speed moves more cloth further, but a body drifting fast and limply must stay silent.
; 0 is pure thrash and tumble.
fSpeedWeight = 0.3

; Body speed, u/s, at which the speed multiplier is at its maximum.
fSpeedForFull = 600

; How much a free fall adds on its own. Off by default: a cloak does flap in a long drop, but the
; airborne whoosh already covers that state and two voices saying 'this body is falling' is one
; too many. Turn it up to make the comparison.
fAirWeight = 0

; Fall speed, u/s, at which the airborne term is at its maximum.
fAirSpeedForFull = 500

; How quiet the layer has to get before its voice is stopped rather than held at silence. There is
; no separate hold time - the release is the hold, and a second timer would be the same delay
; expressed twice.
fSilenceDrive = 0.115

; How fast the level rises. Short: cloth responds immediately, and a slow attack puts the rustle
; behind the impact that caused it.
fAttackMs = 1

; How slowly it falls, and the single most characterful number here. It fills the gaps between
; bounces so a tumble reads as continuous rather than as a rattle, and it leaves a decaying fabric
; tail behind every impact - clothing settling after a hit, with nothing inferred to produce it.
fReleaseMs = 25

; The loop's pitch when barely moving. Keep the range narrow - a garment does not change pitch
; much, and a wide sweep is the fastest way to sound synthetic.
fPitchAtFloor = 0.94

; The loop's pitch at full drive.
fPitchAtFull = 1.07

; A slow wobble on the level so a two-second file does not read as a two-second file.
; Deterministic, not random - the engine has to stay reproducible.
fWanderDepthDb = 1.5

; How slow the wobble is.
fWanderHz = 1.26

; How far the level has to move before the running loop is told about it. Without one a loop emits
; an update every frame and buries the cue list.
fLevelDeadbandDb = 0.5

; Longer than the grind's. Fabric has no transient, and a rustle that snaps in is the most obvious
; thing in the mix.
fStartFadeMs = 0

; How long the layer takes to go once it is under the silence threshold.
fStopFadeMs = 100

; The layer's level at full drive. It is a bed - felt more than heard, and well under the impacts
; it plays between.
fGainDb = -20

; How far under the level the layer sits at the bottom of its ramp. Deep, so crossing the floor is
; not an event in itself.
fDriveRangeDb = -18

; Naked skin. Cut hard by default: with one slot carrying every armour class there is no empty
; slot to make a bare body silent, so this is what does it.
fBareTrimDb = -40

; Clothing, and anything whose class could not be resolved.
fClothTrimDb = 1

; Leather and hide.
fLightTrimDb = -1

; Mail and plate. Genuinely louder than cloth, and this is where to say so.
fHeavyTrimDb = -1

; Your own ragdoll's garment hangs on your own bones, at arm's length from the ears, so it wants
; to sit lower than anyone else's.
fPlayerTrimDb = -3

; How far a running body grind pulls the rustle down, scaled by the grind's own weight so it
; arrives with the slide rather than switching on. A slide already has four layers describing the
; same motion; fabric under all of it is mud.
fSlideDuckDb = 0


[Mix]

; The whole mod's level against the rest of the game. With vanilla's body impacts suppressed there
; is nothing to sit next to, so this calibrates against footsteps and combat - and there is no bus
; control in this engine, so it is the only lever.
fMasterGainDb = 2

; Global trim on the bright contact layer. Up for clicky and present, down for distant and soft.
fTransientTrimDb = 0

; Global trim on the flesh-and-mass layer.
fBodyTrimDb = 0

; Global trim on the pitched boom. The one control most worth touching if the mod feels either
; weightless or overbearing.
fSubTrimDb = 0.5

; Global trim on the small filler taps that give a burst its texture.
fGrainTrimDb = 0

; Global trim on the scrape and cloth loops.
fLoopTrimDb = 0

; Below this a sound is not worth opening a voice for and is dropped before the renderer ever sees
; it. Nothing is capped against the count any more, so this is the one thing standing between the
; mix and a pile of inaudible voices - raise it and the mod spends its work on what can actually
; be heard.
fVoiceFloorDb = -55


[Balance]

; Shape the impact composite differently for the head, the spine and the limbs. Every trim below
; is 0 by default, so this is for switching a balance you have already tuned off in one gesture
; and hearing what it was doing.
bEnabled = 1

; After arbitration. Trim on the bright contact layer of a head impact. The skull accent is a
; separate decision and lives in HeadImpact.
fHeadTransientTrimDb = 0

; After arbitration. A head plays the torso's mass layer, so this is the only way to give a
; faceplant less of it than a back-slam gets.
fHeadBodyTrimDb = 0

; After arbitration. How much of the pitched boom a skull is worth.
fHeadSubTrimDb = 0

; After arbitration. How much of what it hit comes through on a head contact.
fHeadSurfaceTrimDb = 0

; After arbitration. The neck and the torso - the column, and the part with a whole body behind
; it.
fSpineTransientTrimDb = 0

; After arbitration. Trim on the flesh-and-mass layer of a torso landing.
fSpineBodyTrimDb = 1.5

; After arbitration. The boom under a body going down, which is the one the design says should be
; there.
fSpineSubTrimDb = 2

; After arbitration. How much floor comes through under a torso.
fSpineSurfaceTrimDb = 0

; After arbitration. Arms, legs, and anything off a skeleton we could not name.
fLimbTransientTrimDb = 0

; After arbitration. Sits the mass layer back out on a stick. SlotGain:fImpBodyLimb is the other
; half of this and answers a different question - that one is 'this wav is hot', this one is 'a
; forearm has less body in it'. They sum.
fLimbBodyTrimDb = 0

; After arbitration. The one most likely to want moving: a hand slapping the floor has no body
; behind it, so the boom under it is borrowed weight.
fLimbSubTrimDb = 0

; After arbitration. Out on a hand the floor is most of what there is to hear, so this is the one
; of the twelve most likely to want to go up.
fLimbSurfaceTrimDb = 0


[Compress]

; Hold the top of one class of cue down without touching the rest of it. Every threshold below is
; 0 by default, which is the top of the range and therefore no holding at all, so switching this
; on changes nothing until you lower one.
;
; For squeezing the whole range instead of its top, the controls already exist and are global:
; Intensity:fDynamicRangeDb and the two soft-clip knees.
bEnabled = 1

; Decibels in per decibel out, above a threshold. 1 is off. 4 squeezes the loud ones together
; while leaving them distinguishable. 20 is near enough a hard cap to be one - and a hard cap is
; worth avoiding, because everything over the threshold arrives at exactly the threshold and a
; dozen different impacts become a dozen identical ones. One ratio for every class: the thresholds
; say which classes get held, this says how firmly.
fRatio = 17

; Where a four-layer impact starts being held, in dB under the loudest thing this mod can produce.
; 0 is that top, so it holds nothing. The whole stack comes down together, so a held impact keeps
; its transient/body/sub balance and loses only level. Its surface skin is part of the same moment
; and rides on this.
fImpactDb = -5

; Where the small filler taps start being held, in dB under the mod's loudest. The line most worth
; pulling down: nine of every ten contacts are taps, so a tap that can reach the top of the range
; is a tumble with no shape to it. Lower it and the hero hits stand out without anything else
; getting quieter.
fTapDb = -43

; Where the head accent starts being held, in dB under the mod's loudest. Holds the accent once
; the lead boost is in without taking it off the sort - unlike HeadImpact:fLeadMaxLevelDb, which
; does both, and unlike that one this squeezes rather than clamps.
fHeadDb = -5

; Where the bone crunch starts being held, in dB under the mod's loudest.
fCrunchDb = -5

; Where the wet gore layer starts being held, in dB under the mod's loudest.
fGoreDb = -5

; Where the sliding scrape loop starts being held, in dB under the mod's loudest. A loop is
; re-levelled while it runs, so this is the one class where the holding happens continuously
; rather than at one instant.
fScrapeDb = 0

; Where the airborne whoosh starts being held, in dB under the mod's loudest.
fAirborneDb = 0


[Player]

; Whether your own ragdoll makes any sound at all.
bEnabled = 1

; At arm's length collapsing every layer to one point stops helping and starts sounding like the
; audio is inside your head, so your own limbs carry their own sounds.
bAttachToBones = 1

; A 30 Hz boom at zero distance through headphones is overwhelming, and in VR low frequency is
; felt as much as heard. This pulls it back for your own falls only.
fSubTrimDb = 0

; You are the one moving and the view already tells you, so the anticipation whoosh is off for
; your own falls.
bSkipAirborneWhoosh = 1

; Your own ragdoll's level, separate from everyone else's.
fMasterGainDb = -3


[Distance]

; Inside this everything plays: composites, grains, loops and bed. About ten metres.
fFullRadius = 700

; Between the two radii only the hero composites play - nobody resolves the detail at that range.
; Beyond it the actor is dropped entirely, which is what keeps a battlefield of ragdolls from ever
; becoming a performance question.
fSimplifiedRadius = 2100


[Slots]

; Pick variants out of a shuffled bag rather than at random. Random repeats itself immediately,
; and an immediate repeat is exactly what people notice.
bShuffleBag = 1

; Give every cue its own dice, rolled from the contact it came from, instead of dealing from one
; running deck. Off, adding or removing a single cue early in a take re-rolls the sample and the
; pitch of everything after it and two exports differ everywhere rather than where the change bit.
; The seed below still re-rolls the whole take, so the variety is unchanged.
bStableVariants = 1

; Honour the per-file conditions in RagdollSounds_SFX.ini. A file tagged for a surface, an armour
; class or both is only a candidate where it matches, and beats the untagged files where it does.
; Off, every file on a slot is a candidate everywhere - which is what the mod did before
; conditions existed.
bConditionalVariants = 1

; Turn off to ignore the surface half of every condition while the armour half keeps working. This
; and the next answer the question this feature gets asked most: is the stone-specific recording
; actually earning its file, or would the generic one have done?
bSurfaceConditions = 1

; The same for the armour half. With both off the ladder collapses entirely and the master switch
; above is the shorter way to say it.
bArmorConditions = 1

; 0 seeds from the clock, which is what the game wants. Any other value makes every run identical,
; which is what an A/B between two configs needs so it compares the configs and not two dice
; rolls.
iRngSeed = 1


[Layers]

; The contact itself - bright, fast, and the quietest layer of the stack. Mute it and an impact
; loses its edge but keeps its weight.
bImpTransient = 1

; Low-mid flesh and mass, arriving ~20 ms in. The main body of the sound at ordinary intensities,
; where the sub has not taken over yet.
bImpBody = 1

; The late pitched boom, ~65 ms in. The design's central claim is that this one layer is what
; makes a hit read as mass rather than contact - mute it and the gnarl should leave with it. If it
; does not, the balance is wrong, not the timing.
bImpSub = 1

; The burst filler: quiet, dry, heavily pitch-scattered taps that give a burst its three to five
; grains. Mute it to hear the bursts reduced to their hero hits alone.
bLimbTap = 1

; The granular low-mid crackle that is what a bone break actually is - ten times the transient
; density of a plain thud in that band, not a snap sample. Covers spine_crunch and limb_crunch
; too: they are the same layer on a different bone. To silence one part and not the others use
; Damage:b<Part>Enabled, which stops the cue being proposed rather than muting it after the
; arbitrator made room for it.
bCrunchGran = 1

; The wet squelch: the top damage tier, and the one layer all three parts share. The fastest way
; to check the gore thresholds are not opening on ordinary knockdowns.
bGoreWet = 1

; The catches a slide is punctuated by. Mute it and the grinds are left running underneath, which
; is the A/B for whether the irregularity is what makes a slide sound like a body.
bScrapeGrain = 1

; The full-weight sliding rumble, surface variants included. The A/B for the body half of a slide:
; mute it and the state, the budget, the slide-end impact and the limb grinds all still happen.
bScrapeLoop = 1

; The light grind of one limb dragging, surface variants included. Mute it and a dragging foot
; goes silent while a full slide is untouched, which is the cleanest way to hear what the two-loop
; split bought.
bScrapeLimb = 1

; The airborne anticipation rise. Mute it to judge whether the fall still reads as a fall without
; being told one is coming.
bAirWhoosh = 0

; The dull skull thud with its granular edge. Mute it to check the head gate is firing on head
; contacts and not on everything that happens to be moving fast.
bHeadImpact = 1

; The soft final flop that closes the event. Mute it and falls should audibly trail off
; unfinished, which is the whole reason it exists.
bSettleRest = 1

