; the accent of.
fHeroFloorReliefAtFrac = 0.31

; How much comes off the hero floor when it does, on that same scale, so the two subtract: a 0.30
; floor with 0.10 here is a head floor of 0.20. It also lowers what the dominance test measures a
; quiet moment against, which is what actually lets the head anchor rather than merely pass the
