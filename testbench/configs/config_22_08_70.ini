; the fastest thing in the frame and the least of the collision; this is the head-specific half of
; the effective-mass problem.
bCompanyEnabled = 1

; More other limbs than this hitting the world in the same frame and the head is treated as part
; of a sprawl. Zero damps any head that does not land alone.
iCompanyMaxPeers = 2

; How much faster than the fastest limb beside it the head must be to still count as the strike.
; Below this it is damped however few limbs are touching.
fCompanyLeadFrac = 1.3

; How much the gate rises for a head inside a pile, as a fraction of itself.
fCompanyGateFrac = 0.2

; Before arbitration: how far the accent drops for a head inside a pile, and how far it drops in
; the sort with it - so a sprawled head stops outranking the limbs the loudness actually belongs
; to.
fCompanyDampDb = -9

; After arbitration: the same drop as loudness alone. Damping a sprawl purely here keeps the
; accent's place in the sort while taking it down in the mix - for when it is the right cue to
; spend the budget on and merely the wrong size.
fCompanyTrimDb = 0

; Let a hard head strike open a hero moment the ordinary floor would have refused. The moment axis
; is otherwise limb-blind, so a faceplant that is plainly what a fall was about can come out as
; just another contact. Off, a head has to clear the same bar as an elbow.
bHeroFloorRelief = 0

; How hard the head has to hit to earn the relief, as a multiple of the loud anchor - the same
; scale as the gate point above, so both stay where they are in the range when the anchor moves.
