bClaimsOnsetOnHero = 1


[AirTime]

; Tell a dive from a sprawl by how long the body had been clear of the ground when the head
; arrived, rather than by how fast the head was going. Off, a head that lands first and a head
; that lands last sound the same at the same speed.
