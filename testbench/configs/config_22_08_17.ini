; RagdollSounds_Algorithm.ini - written by the testbench
; Written by Physical Ragdoll Sounds. Every key carries the comment that says
; what it changes perceptually; delete a key to go back to its default.


[Ingest]

; The quietest contact allowed to make any sound at all. Raise it and the small taps that fill out
; a tumble disappear; lower it and the settle at the end of a fall starts chattering.
fMinImpactSpeed = 20

; How far the solver's closing speed and our own reconstruction of it may differ before the
; contact is treated as a physics explosion and thrown away. Lower is stricter: too low and real
; hard landings go silent.
fBlowupDisagreeFrac = 0.1

; Backstop for contacts with no reconstruction to check against. Anything faster is discarded as
; impossible, so setting it low makes the hardest hits in the game the only ones that never play.
fBlowupSpeedCeiling = 1000

; The same backstop for spin. A genuine armoured landing spins a limb to 60 rad/s, so anything
; near that discards real impacts.
fBlowupAngularCeiling = 200

; Half of all contacts are one limb touching another limb of the same body. Below this they only
; thicken the cloth bed; above it they play as real impacts. Drop it and a ragdoll rattles against
; itself constantly.
fSelfContactThreshold = 250

; Every limb-on-own-limb contact is reported twice, once from each limb. Off, they all play twice
; and the whole mix doubles at the moment of landing.
bDropMirroredSelfContacts = 1

; How large a gap between contact reports means a new frame started. Only matters on replay; the
; measured split is one microsecond inside a frame against 20 ms between.
fFrameGapMs = 2

; One collision surface reported at several points becomes one contact at the strongest of them.
; Off, a flat landing on a floor plays several times over.
bCollapseManifolds = 1

; How much faster a contact must be sliding along a surface than into it before it is heard as a
; scrape rather than a thud. Lower sends more of a tumble to the scrape loop and takes the punch
; out of it.
fGrazeRatio = 1.5

; Above this closing speed a contact is always a thud, however much it is also sliding. Raise it
; and hard skids go quiet as the scrape path swallows them; lower it and genuine slides start
; thudding.
fGrazeMaxImpactSpeed = 220


[GlancingImpact]

; Judge a landing limb by how much of its motion went into the ground rather than past it. Off, a
; foot the body drops squarely onto and a foot that clips the floor on the way past sound the same
; at the same closing speed.
bEnabled = 1

; At or above this share of the limb's speed going into the surface, the landing is square and
; nothing is taken off. Measured: a foot the body lands squarely on reads 0.99, a knee taking part
; of a fall 0.74, a foot clipping the floor 0.58.
fFullTransferFrac = 0.9

; At or below this the reduction is at full. Between the two the ramp is linear. Set it close to
; the value above for a sharp switch, far below it for a gentle slope.
fNoTransferFrac = 0

; What fraction of its intensity a fully glancing landing keeps. Intensity carries the event's
; class and its rank, so low enough and the landing drops through the composite threshold and
; plays as a limb tap. One leaves intensity alone and uses only the level cut below.
fMaxIntensityScale = 0

; How much level a fully glancing landing loses before arbitration - so it is both quieter and
; ranked lower, and gives up the hero slot to whatever lands next. It does not change the cue's
; class; only the intensity scale above can do that.
fMaxGainCutDb = -13.5

; How much level a fully glancing landing loses, applied after arbitration - so it gets quieter
; and nothing else about the fall moves. This is the knob for separating a clipped landing from
; the hit after it without disturbing the rest.
fMaxTrimCutDb = -7.5

; Sideways speed over closing speed, above which the contact starts looking like a slide rather
; than a clipped landing and the reduction begins backing off. A clipped foot runs about 1.4; a
; body sliding along the floor runs 3 to 17.
fSlideRatioStart = 2

; Above this ratio the contact is a slide and the rule leaves it alone entirely. Without it a body
; sliding to a halt has every contact turned into a tap, which is not what a slide sounds like.
fSlideRatioFull = 4

; Whether the thigh counts as a landing limb beside the foot and the calf. Off, only feet and
; knees are judged and a hip skidding in stays at full level.
bIncludeThigh = 1

; Below this the limb is barely moving and the angle it arrives at means nothing, so the rule
; leaves it alone.
fMinBodySpeed = 60

; Whether a glancing landing must arrive proportionally faster to break a bone. Off by default: a
; bone can break at any angle, and the crunch is already quieter because the intensity behind its
; level fell. Turn it on if clipped landings crunch too readily.
bScaleCrunchGate = 0


[Phase]

; How far off the ground the body has to be before the airborne rise starts. Too low and the
; whoosh fires during an ordinary shove.
fAirborneMinHeight = 40

; And for how long, so a body that bounces once does not read as a fall.
fAirborneMinTimeMs = 120

; How big a share of the fall's energy a contact must carry to count as the hero moment. Higher
; means fewer knockdowns get a hero treatment and more of them read as a flat tumble.
fPrimaryImpactEnergyFrac = 0.35

; How long the hero moment stays open for its peers. A faceplant genuinely has a knee, a chest and
; a head arriving inside a couple of hundred milliseconds; shorten this and only the first of them
; is loud.
fPrimaryImpactWindowMs = 220

; How fast a body has to be travelling along the ground before the slide phase opens and the
; grinding loop is allowed.
fSlideMinTangentSpeed = 120

; And for how long, so a single glancing blow does not read as a slide.
fSlideMinDurationMs = 150

; The energy the fall has to drop below before it is considered over. Raise it and knockdowns
; close early, cutting off the last real bounce; lower it and the closing cue arrives late.
fSettleEnergyFloor = 80

; How much quiet is needed before the event closes. This is what stops a fall that pauses
; mid-tumble playing its closing cue too early.
fSettleQuietMs = 0

; Silence held after a ragdoll ends, covering the blend back to animation. A guess: every capture
; take was paralysed and none of them ever got up.
fGetUpBlendMs = 400

; How loud the moment of being knocked over is, before anything has landed.
fLaunchTrimDb = -6

; How many sounds the launch may spend at once.
iLaunchMaxCues = 2

; How loud anything is while the body is in the air. Should be well down: the airborne section is
; anticipation, not event.
fAirborneTrimDb = -9

; How many sounds may play while airborne.
iAirborneMaxCues = 1

; The hero moment's own trim. This is the reference every other phase is quieter than, so moving
; it moves the whole knockdown.
fPrimaryImpactTrimDb = 0

; How many grains the hero burst may contain. The references measure three to five.
iPrimaryImpactMaxCues = 5

; How loud the rolling section after the first landing is.
fTumbleTrimDb = -3

; How many grains a tumble burst may contain.
iTumbleMaxCues = 4

; How loud the impacts during a slide are. The grinding loop has its own gain.
fSlideTrimDb = -6

; How many one-shots may punctuate a slide, for the moments a limb catches.
iSlideMaxCues = 2

; The last twenty contacts of every knockdown are settles and should be nearly silent. This one
; number is what keeps a fall from ending in a rattle.
fSettleTrimDb = -14

; How many sounds the settle may spend. One is the design.
iSettleMaxCues = 1


[Slide]

; Let the grazes a slide is made of make a sound of their own. Normally a graze is sideways motion
; instead of a hit, so the grinding loop claims it and the impact path never sees it - which is
; why a body dragging across flagstones is a grind with nothing on top of it. With this on the
; graze still drives the loop and is also offered as a limb tap, so the slide clatters as well as
; grinds. Only ever a tap: a graze is too slow to build a real impact out of.
bTapsEnabled = 1

; What the minimum impact speed is multiplied by while sliding. This is the first gate and the
; bluntest one - a limb skipping along a floor closes on it at a few units per second, so at the
; shipping floor most of a slide never enters the pipeline at all. One leaves the floor alone;
; lower lets the small stuff in.
fTapFloorFrac = 0.35

; How much bigger a sliding graze is made. Intensity is the loud knob - it sets the level the tap
; is built at and what the arbitrator ranks it by - so this is the main sensitivity control. The
; fall's own size is untouched, so lifting a slide contact cannot walk the actor into a different
; phase.
fTapIntensity = 0.1

; Added before arbitration, where a level is also a rank - so this is what stops the taps being
; crowded out by the landing that put the body on the floor.
fTapGainDb = 6

; ...and after it, where it is loudness alone. This is also how you pay back the slide phase's own
; -6 dB, which was set when a slide was only ever a grind.
fTapTrimDb = 6

; The ceiling the level lift may reach: where the tap lands, not how much is added. Zero is the
; engine's own natural ceiling. Cuts are never capped.
fTapMaxLevelDb = 0

; How much of the global rate cap a sliding tap is held to. This is the rhythm knob, and it
; decides whether the slide gets texture or a machine gun. The cap exists because two onsets
; closer than 46 ms add mud - true of two body impacts, much less true of two taps twenty decibels
; under them. One is the cap as it stands, zero removes it.
fTapRateCapFrac = 0.5

; How much further under the masking ceiling a tap may sit before it is dropped. This is what
; actually kills slide taps: the ceiling is still up from the landing that started the slide, and
; a tap far under it is discarded rather than played quietly. The taps are not competing with that
; landing though - they ride on a grind that is already audible - and this is how much of that
; judgement to suspend.
fTapMaskWidenDb = 12

; Extra grains for the burst a tap lands in, on top of the slide phase's own allowance. Two per
; burst is right for a phase that was only ever meant to be a grind and nothing like enough for
; one meant to clatter.
iTapGrains = 3

; How much of the silence the arbitrator insists on between bursts a sliding tap may waive. One
; waives it entirely, which is what a continuous slide wants; nothing holds it to the 300 ms that
; shapes a tumble.
fTapBurstGapFrac = 0.75

; The same willingness for the contacts during a slide that really are collisions - a knee
; catching a rock halfway down. Those already reach the impact path and are built exactly as they
; always were; what stops them being heard is the slide phase's mean budget and a masking ceiling
; still up from the landing. This buys them out of both. It changes no cue's class, so it cannot
; invent a hero moment - it can only stop one being thrown away.
bImpactsEnabled = 0

; What the minimum impact speed is multiplied by, for contacts during a slide that are not grazes.
; One leaves the floor alone.
fImpactFloorFrac = 0.6

; How much bigger a real collision during a slide is made. Unlike the tap half this one can change
; a cue's class - enough of it turns a tap into a full composite - which is exactly what you want
; if the knee catching the rock is coming out as filler.
fImpactIntensity = 0.05

; Added before arbitration, where a level is also a rank.
fImpactGainDb = 3

; ...and after it, where it is loudness alone and cannot take the frame over.
fImpactTrimDb = 3

; The ceiling the level lift may reach. Zero is the engine's own natural ceiling.
fImpactMaxLevelDb = 0

; How much of the global rate cap a collision during a slide is held to. One is the cap as it
; stands.
fImpactRateCapFrac = 0.75

; How much further under the masking ceiling a collision during a slide may sit before it is
; dropped.
fImpactMaskWidenDb = 8

; Extra grains for the burst it lands in, on top of the slide phase's own allowance.
iImpactGrains = 2

; How much of the silence between bursts a collision during a slide may waive.
fImpactBurstGapFrac = 0.5


[Arbitration]

; The shortest gap allowed between any two impact onsets, whatever limb they came from. Below
; about 46 ms extra onsets stop adding detail and start adding mud; well above it a knockdown
; starts to sound sparse and deliberate.
fRateCapMs = 43

; How much louder than the impact holding the rate cap a new one must be to get through anyway.
; Lower lets a busy crash keep more of its hits; raise it towards 60 to switch the override off
; and let the cap always win.
fRateCapOverrideDb = 16

; How long one limb chain stays claimed by its strongest contact. This is what turns a hand, a
; wrist and an elbow landing together into one arm flop.
fChainMergeWindowMs = 60

; How far under the loudest recent sound a proposal has to be before it is dropped outright rather
; than played quietly. Small values let everything through and the landing turns to porridge;
; large values leave only the heroes.
fMaskDropBelowDb = 12

; How fast the ear is assumed to recover after a loud hit. Slower means a big landing keeps the
; following second quiet.
fMaskDecayDbPerSec = 60

; How many sounds one audible moment is built from. The references measure three to five; more
; reads as a machine gun rather than as an impact with texture.
iBurstMaxGrains = 5

; How long one burst may last before it has to end. This plus the grain count is the shape of an
; audible moment.
fBurstWindowMs = 110

; The silence enforced between audible moments. This is the single biggest lever on whether a
; three-second tumble reads as four events or as thirty.
fBurstMinGapMs = 300

; During a hero moment, place every layer at one point. Several points read as several events; one
; point reads as one event with detail.
bSpatialCollapseOnHero = 1

; How long the collapse holds before the sound spreads back out across the limbs for the tumble.
fSpatialCollapseWindowMs = 200

; How many frames every window is worth as well as its millisecond floor, so the system behaves
; the same at 24 fps and at 144. Zero pins every window to its floor and makes the mod frame-rate
; dependent.
fFrameScaleK = 2


[Intensity]

; The contact speed that maps to the bottom of the loudness range. Anything at or under it is as
; quiet as the mod goes.
fSpeedRefLow = 20

; The contact speed that maps to full level. A guess, not a measurement: the take that would have
; established it was discarded. Lower it and ordinary knockdowns get loud; raise it and nothing
; ever reaches the top of the range.
fSpeedRefHigh = 510

; The whole span from the quietest contact to the loudest, in decibels. The references use about
; 35; a naive loudness curve gives 60 and sounds wrong at both ends - shouty at the top, inaudible
; at the bottom.
fDynamicRangeDb = 15

; Where the loudness sits between the two anchors. Under 1 fills the middle out and makes ordinary
; contacts more present; over 1 keeps everything quiet until it is genuinely hard.
fCurveExponent = 1.2

; Where the curve stops being straight and starts compressing, so another mod's absurd impulse
; gets loud rather than rejected. A silent obliterate is the worst possible outcome.
fSoftClipKnee = 0.25

; How much a limb's own size makes it louder. At zero a fingertip and a torso at the same speed
; sound identical; high values make torso landings dominate everything.
fMassWeight = 0.9

; The same, from the limb's physical bounding radius rather than its mass. This is the half that
; still works on a skeleton we do not recognise.
fRadiusWeight = 0.2

; Where a contact stops being a fall and the gore tier opens, as a multiple of the loud anchor.
; Above 1 is above anything the mod treats as loud, which is where it belongs; under 1 and
; ordinary hard landings start coming apart.
fObliterateFrac = 2.7451


[PostIntensity]

; Widens or narrows the gap between the quietest contact and the loudest, after every layer has
; been chosen. Unlike the dynamic range above it moves loudness only - the same contact is still
; built from the same layers at the same pitch.
fExtraRangeDb = -7.5

; Where the level sits between the two anchors, on top of the curve above. Under 1 brings ordinary
; contacts forward without giving them a heavier stack; over 1 holds them back without making them
; thinner. 1 changes nothing.
fCurveExponent = 2.4

; Compresses the top of the level range so an absurd impulse gets loud rather than enormous, while
; still being built as the obliterate it is. 1 is off.
fSoftClipKnee = 1


[SlotGain]

; The bright contact click, on its own. The one to reach for when the attack reads as a tick
; rather than as a hit.
fImpTransient = 0

; The low-mid flesh and mass. Carries most of what a body sounds like, so a decibel here is
; audible on every impact in the mod.
fImpBody = 0

; The late pitched boom - the loudest layer and the whole of the gnarl. Down a couple of decibels
; if the mod is booming through a soundbar.
fImpSub = 0

; The hollow knock, alone. Wood is the surface most likely to arrive louder than the other two,
; because a hollow knock is easy to record hot.
fSurfWood = 0

; The hard short skin, alone. Short files read quiet at the same peak, so this is usually the one
; that needs lifting.
fSurfStone = 0

; The dull skin, and the one anything unresolved falls back to - so it plays far more often than
; the other two and is worth setting last.
fSurfSoft = 0

; The burst filler. Quiet and dry by design: lift it and a tumble turns busy, drop it and the gaps
; between the real impacts open up.
fLimbTap = 0

; The granular bone break. Loud enough to be a fact about what happened, not so loud that it
; becomes the impact.
fCrunchGran = 0

; The squelch, obliterate tier only. It plays rarely enough that it is easy to leave far too hot
; without ever noticing.
fGoreWet = 0

; The grinding loop. Sits about 20 dB under the impacts; if it reads as a hiss rather than as a
; rumble the file is wrong, not the gain.
fScrapeLoop = 0

; The cloth bed. It is what papers over the one-shots, so it wants to be felt as continuity rather
; than heard as a sound.
fFoleyCloth = 0

; The airborne rise. Anticipation, not event - lift it and every knockdown announces itself before
; it has landed.
fAirWhoosh = 0

; The skull accent. Rare and unmissable is the brief, and it rides on a full composite already, so
; it needs less than it looks like it does.
fHeadImpact = 0

; The closing flop. Quiet enough to read as a full stop rather than as one more impact.
fSettleRest = 0


[Limbs]

; Off, how loud an impact is depends on which limb touched - and a foot is quiet even when the
; whole body lands on it. On, it depends on how much of the body is actually arriving, judged by
; how much the limb is travelling rather than swinging.
bMassDeterminesLoudness = 1

; How loud a landing that brings the whole body with it is, on the same scale as the limb table (a
; foot is 1, a thigh 7, the trunk 7.5). Every fully coupled contact uses this whatever limb it
; came through, which is what makes a feet-first and a hip-first landing at the same speed sound
; alike.
fBodyMass = 3.5

; How much spin counts as a limb swinging on its own rather than being carried. Lower and more
; contacts are treated as flails and go quiet; higher and even a whipping arm is priced as the
; body landing.
fRotationRefRatio = 1.1

; How far towards the whole-body mass a coupled contact is allowed to go. At 0 the toggle above
; does nothing; at 1 a body landing is priced entirely as a body.
fCouplingWeight = 1

; A limb moving slower than this delivers nothing however straight its path is. Stops a body
; settling slowly onto the floor being priced as a landing.
fMinBodySpeed = 120


[ImpactComposite]

; The core layer stack. Off, the mod plays only accents and loops and every impact loses its body.
bEnabled = 1

; Under this intensity a contact plays as a single tap instead of a four-layer composite. It is
; the only place a level decision changes a cue's class, so it is the line a reduction has to
; cross before a landing stops being a hero moment. Raise it and more of a tumble becomes texture.
fTapBelowIntensity = 0.15

; When the bright contact click lands. This is the reference everything else is measured from and
; should stay at zero.
fTransientOffsetMs = 0

; When the wood, stone or soft colour arrives. Close to the transient, or it stops reading as the
; same event.
fSurfaceOffsetMs = 8

; When the low-mid flesh and mass arrives. Measured at 8-34 ms in the references.
fBodyOffsetMs = 20

; When the pitched boom arrives. The single most important number in the mod: at 65 ms an impact
; reads as mass, at 0 it reads as a click with a thud stuck to it, and past 120 ms it stops
; belonging to the impact at all.
fSubOffsetMs = 65

; A few milliseconds of variation on each layer so no two composites have exactly the same
; envelope. Large values smear the shape instead of varying it.
fOffsetScatterMs = 4

; How much of the stack is the bright click on the lightest contact. Light contacts are almost all
; transient.
fTransientGainAtMinDb = -5

; And on the heaviest, where it only rides on top of the sub.
fTransientGainAtMaxDb = -18

; How much flesh a light contact has.
fBodyGainAtMinDb = -8

; And a heavy one.
fBodyGainAtMaxDb = -2

; How much boom a light tap gets. Should be almost none, or every tap sounds like a cannon.
fSubGainAtMinDb = -30

; And a hard landing, where it is the loudest thing in the stack. This is where the gnarl comes
; from.
fSubGainAtMaxDb = -6

; How audible the surface colour is on a light contact.
fSurfaceGainAtMinDb = -12

; And on a heavy one. If the surface reads as a separate sound rather than as colour, it is too
; loud.
fSurfaceGainAtMaxDb = -6

; Random pitch spread per voice. This is what stops thirteen files sounding like thirteen files.
; Past about three semitones it starts sounding like a pitch trick.
fPitchScatterSemis = 2.5

; How far down a heavy impact is pitched relative to a light one. Negative reads as heavier and
; bigger for free.
fPitchIntensityBiasSemis = -3

; The hard limit on the two above put together, so nothing ever sounds obviously transposed.
fPitchMaxSemis = 3


[HeadImpact]

; Head contacts get their own accent on top of the composite. Off, a head landing is just another
; limb.
bEnabled = 1

; How hard a head has to hit before the accent fires, as a multiple of the loud anchor - so it
; stays where it is in the range when the anchor moves. Low values put a skull crack on every roll
; of the neck.
fGateFrac = 0.24

; Before arbitration: how loud the head accent is against the stack, and therefore also how
; important. Pulling a hot head_impact wav down here costs the accent its place in the sort as
; well as its level - use the trim below for pure voicing.
fGainDb = -12.5

; After arbitration: the same balance with no effect on the sort, the rate cap or the budgets.
; This is where wav voicing belongs; the slider above is where the *event* belongs.
fTrimDb = 0

; How much more willing the gate is when the head is already the low point of the body - a
; faceplant rather than a knock.
fHeadDownBonus = 0

; Quieten a head that arrives inside a pile of other limbs. A head at the end of a spine whip is
; the fastest thing in the frame and the least of the collision; this is the head-specific half of
; the effective-mass problem.
bCompanyEnabled = 1

; More other limbs than this hitting the world in the same frame and the head is treated as part
; of a sprawl. Zero damps any head that does not land alone.
iCompanyMaxPeers = 2

; How much faster than the fastest limb beside it the head must be to still count as the strike.
; Below this it is damped however few limbs are touching.
fCompanyLeadFrac = 1.3

; How much the gate rises for a head inside a pile, as a fraction of itself.
fCompanyGateFrac = 0.2

; Before arbitration: how far the accent drops for a head inside a pile, and how far it drops in
; the sort with it - so a sprawled head stops outranking the limbs the loudness actually belongs
; to.
fCompanyDampDb = -9

; After arbitration: the same drop as loudness alone. Damping a sprawl purely here keeps the
; accent's place in the sort while taking it down in the mix - for when it is the right cue to
; spend the budget on and merely the wrong size.
fCompanyTrimDb = 0

; Let a hard head landing buy back some of the arbitration budget the rest of the fall already
; spent. Off, the loudest contact in a take can be silenced by a thigh tap that opened a burst a
; moment earlier.
bRefundEnabled = 1

; How far clear of its own gate a head contact must be to earn a refund, as a multiple of that
; gate. The gate already moves with the lead and company rules, so this rides on top of whatever
; they decided.
fRefundGateFrac = 1.6

; Extra grains inside the burst the contact lands in. This is the half of the refund that answers
; a drop marked `burst full`.
iRefundGrains = 1

; How much of the silence the arbitrator insists on between bursts is waived. One waives it
; entirely. This is the half that answers a drop marked `burst gap`, which is what silences a head
; landing arriving between two bursts.
fRefundBurstGapFrac = 0.95

; Whether a refunded contact also ignores the global rate cap - what answers a drop marked `rate
; cap`. On, a skull landing 20 ms after a foot is still its own sound.
bRefundIgnoreRateCap = 1

; The ceiling per knockdown, so a head bouncing down a staircase cannot buy the whole budget back
; one bounce at a time.
iRefundMaxPerEvent = 1


[AirTime]

; Tell a dive from a sprawl by how long the body had been clear of the ground when the head
; arrived, rather than by how fast the head was going. Off, a head that lands first and a head
; that lands last sound the same at the same speed.
bHeadEnabled = 1

; How long the rest of the body must have been off the ground for the head to count as leading.
; Short values call the end of an ordinary sprawl a dive; long ones only fire on a real fall from
; height.
fHeadClearMs = 350

; A hand touching down with the head is the arm you threw out in front of the dive, not proof the
; body was already down. Off, one hand landing in the same frame as the skull collapses the air
; time to nothing and the rule never fires. Hands still count as company, and they always count
; for the body half and for the budget reset.
bHeadExcludeHands = 1

; How recently a hand must have touched down to be forgiven as part of the dive. Larger forgives
; more. Too large and a body that broke its fall on one arm and clipped its head a second later
; reads as a faceplant.
fHeadHandGraceMs = 220

; How much lower the head gate sits for a head that led the body in, as a fraction of that gate.
; This is what lets a slow, deliberate faceplant through a gate set high enough to keep every
; tumbling skull out.
fHeadGateBonus = 0.55

; Added to the accent for a head that fully led the body in, and scaled down to nothing as the air
; time shortens. Before arbitration, so it buys the accent rank as well as loudness.
fHeadGainDb = 9.5

; The same boost after arbitration, where it is loudness alone and nothing caps it. Reach for this
; when the accent is simply too quiet and the sort is already coming out right.
fHeadTrimDb = 0

; The ceiling the boost may lift the accent to - where it lands, not how much is added. It exists
; because a level before arbitration is also a rank: without it a large boost on an already-loud
; contact does not just make the skull loud, it makes it outrank the whole frame. Zero is the
; engine's own natural ceiling and costs an ordinary head accent nothing. Cuts are never capped.
fHeadMaxLevelDb = 0

; How far either side of a led head contact its neighbours are lifted with it, in milliseconds. A
; dive is not one sound, and an accent floating over silence does not read as a body going down.
; Full lift at the head's own moment, ramping to nothing at this distance. Zero is off. Backwards
; it reaches only to the start of the head's own frame.
fHeadHaloMs = 0

; How much bigger a neighbouring contact is made at the centre of the halo. Intensity moves the
; layer balance, the pitch and whether the contact is a composite at all, so a small number here
; does more than a large one in dB. The fall's own size is untouched.
fHeadHaloIntensity = 0

; Added to a neighbour before arbitration, so it lifts that neighbour's rank too. This is what
; stops a boosted head crowding out the very contacts that frame it.
fHeadHaloGainDb = 0

; ...and after it, where it is loudness alone.
fHeadHaloTrimDb = 0

; The crunch gate a led head is held to instead of the global one, as a multiple of the loud
; anchor. This is what puts a crunch on a slow dive without putting one on every fast sprawl. Zero
; leaves the crunch gate alone.
fHeadCrunchGateFrac = 1.38

; How often a led head over that gate actually crunches. One means every time; lower keeps a dive
; from sounding scripted. The global crunch ramp is not used here - it runs up to the certain
; speed and would leave a dive at the bottom of it.
fHeadCrunchProbability = 1

; A head impact at full air time stops being an accessory and becomes its own onset. Off, the
; accent still dies with whatever composite the arbitrator dropped, which is how a 537 u/s skull
; landing makes no sound at all.
bHeadClaimsOnset = 1

; The same idea for every limb that is not the head: a contact that arrives after real air time is
; a landing, and one that arrives mid-tumble is not. Closing speed cannot tell those apart - a
; tumble reaches the speeds it fell at - so without this the end of a fall is mixed exactly like
; the middle of one.
bBodyEnabled = 0

; How long the body must have been off the ground for a limb to get the full lift, with a linear
; ramp up to it. Hands count as the ground here, so an arm that broke the fall ends the air time
; for everything after it.
fBodyClearMs = 250

; How much bigger a landing is made at full air time. Intensity is the loud knob - it moves the
; layer balance, the pitch bias and whether the contact is a composite at all rather than a tap -
; so this is the one that turns a landing that was filler into an event. The fall's own size is
; untouched, so a lifted landing cannot walk the actor into a different phase.
fBodyIntensity = 0

; Added before arbitration, where a level is also a rank - so this is what stops the landing being
; crowded out by the scuffs around it.
fBodyGainDb = 0

; ...and after it, where it is loudness alone and cannot take the frame over.
fBodyTrimDb = 0

; The ceiling the lift may reach, exactly as the head's: where the contact lands, not how much is
; added. Zero is the engine's own natural ceiling. Cuts are never capped.
fBodyMaxLevelDb = 0

; Let a landing that has been in the air long enough start the arbitrator's budgets over,
; whichever limb it lands on. The head refund does this for a hard skull strike judged on speed;
; this does it on air time, and it is what answers a fall that went silent because a scuff opened
; a burst and filled it while the body was still falling.
bResetEnabled = 0

; How long the body must have been clear of the world to earn a reset. A threshold, not a ramp -
; you cannot hand back half a budget - and deliberately longer than the ramps above: those shape
; how a landing sounds, this decides whether it is heard at all.
fResetClearMs = 400

; Close whatever burst was open and let the landing open its own with the grain count back at
; zero. This is the whole point of the rule; off, a reset is a refund by another name.
bResetBurst = 1

; Extra grains for that burst on top of the phase's own allowance, for when a landing wants to be
; more than one sound.
iResetGrains = 0

; How much of the silence the arbitrator insists on between bursts the landing may waive - what
; answers a drop marked `burst gap`. One waives it entirely.
fResetBurstGapFrac = 1

; Whether the landing also ignores the global rate cap - what answers a drop marked `rate cap`.
bResetIgnoreRateCap = 1

; The ceiling per knockdown. A fall is one landing; a body bouncing down a staircase is not
; entitled to a fresh budget for every bounce.
iResetMaxPerEvent = 1


[CrunchGore]

; The granular bone-break layer. This is most of what makes the mod gnarly.
bCrunchEnabled = 1

; The wet layer, above the obliterate tier. Nothing a fall can produce reaches it.
bGoreEnabled = 1

; Where a crunch becomes possible, as a multiple of the loud anchor. An ordinary shove peaks at
; about half of it and a three-metre fall at three quarters, so the default has an ordinary
; knockdown crack occasionally and a real fall crack always.
fCrunchGateFrac = 0.9804

; Where a crunch becomes guaranteed, on the same scale. The span between this and the gate is the
; probability ramp - soften a gate with probability, never with volume. At or below the gate it is
; a hard threshold instead.
fCrunchCertainFrac = 1.37

; How likely a crunch is at the gate itself, before the ramp adds anything. At zero the bottom of
; the ramp is dead and crunches really start well above where the gate says; at one the ramp is
; bypassed and the gate is hard.
fCrunchGateProbability = 0.15

; How far back below the gate the impact has to fall before another crunch is possible, on the
; same scale as the gate, so it does not flicker on and off during a tumble.
fCrunchHysteresisFrac = 0.1373

; The ceiling per knockdown, so a long tumble does not turn into a bag of breaking sticks.
iMaxCrunchesPerEvent = 3

; Where the wet layer opens, as a multiple of the loud anchor. Should sit above anything a fall
; can produce, and the obliterate point has to be cleared as well.
fGoreGateFrac = 0.6863

; How loud a crunch is against the impact it rides on.
fCrunchGainDb = -35.5

; How loud the wet layer is.
fGoreGainDb = -6


[ScrapeLoop]

; The sustained grinding loop for a body dragging along a surface.
bEnabled = 0

; How fast the limb has to be travelling along the surface for the loop to be worth starting.
fMinTangentSpeed = 660

; How gently the grind arrives. Too short and it clicks in at the start of a slide.
fStartFadeMs = 310

; How gently it leaves. Longer than the fade in, or a slide ends abruptly.
fStopFadeMs = 840

; How long the contact has to persist before a loop opens, so a single glancing blow does not
; start one.
fMinDurationMs = 100

; How far a body must travel along a surface to open the slide loop, if it gets there before the
; time above. A fast skid covers ground in a few frames; without this only slow grinding ever
; counted as a slide.
fMinDistance = 45

; How far the body slides before the loop reaches full level. Short, and a glancing skid already
; sounds like being dragged; long, and only a proper slide is fully audible.
fFadeInDistance = 160

; How far under its level the loop starts before distance walks it up. At 0 the fade is off and
; the loop opens at full level.
fFadeInFloorDb = -15

; How loud the grind sits under the impacts. The references put a slide 15-25 dB under them.
fGainDb = -18.5

; The sliding speed the loop is quietest at.
fSpeedForMinGain = 120

; And the speed it reaches full level at, so the grind tracks the slide rather than sitting at one
; level throughout.
fSpeedForMaxGain = 600

; How much faster the grind plays as the slide speeds up. A little sells the acceleration; a lot
; sounds like a tape being spooled.
fPitchPerThousandUnits = 0.15


[MotionFoley]

; The continuous cloth bed under everything. It is what papers over the one-shots and makes a fall
; sound like one continuous thing.
bEnabled = 1

; How loud the bed is. The references put it 30-36 dB under the hero hit; bring it up and it stops
; being a bed and starts being a sound.
fBedGainDb = -33

; The body speed the bed is quietest at.
fSpeedForMinGain = 30

; And the speed it reaches full level at, so the cloth tracks how fast the body is actually
; moving.
fSpeedForMaxGain = 500

; The anticipation whoosh while a body is in the air. On by default at a low level: it tells the
; ear something is about to land.
bAirborneRise = 1

; How loud the whoosh is. It should be felt rather than heard.
fAirborneRiseGainDb = -24

; Drop the bed for a moment just before a big landing so the hit lands harder. Three of four
; reference clips do it, which is not enough to be sure it was deliberate, so it ships off and is
; meant to be tuned by ear.
bPreImpactDuck = 0

; How far the bed drops for the duck. The references measure 8-15 dB.
fPreImpactDuckDb = -10

; How long before the landing the duck starts.
fPreImpactDuckMs = 70


[SettleClose]

; One quiet cue when the fall is over. Falls that just trail off feel unfinished.
bEnabled = 0

; How loud the closing flop is. It is punctuation, not an event.
fGainDb = -27

; How long after the body goes quiet the closing cue lands. Too soon and it sounds like another
; impact; too late and the fall has already been forgotten.
fDelayMs = 70


[Mix]

; The whole mod's level against the rest of the game. With vanilla's body impacts suppressed there
; is nothing to sit next to, so this calibrates against footsteps and combat - and there is no bus
; control in this engine, so it is the only lever.
fMasterGainDb = 2

; Global trim on the bright contact layer. Up for clicky and present, down for distant and soft.
fTransientTrimDb = 0

; Global trim on the flesh-and-mass layer.
fBodyTrimDb = 0

; Global trim on the pitched boom. The one control most worth touching if the mod feels either
; weightless or overbearing.
fSubTrimDb = 0

; Global trim on the wood, stone and soft colour. Up makes the floor material obvious; down makes
; every surface sound the same, which is what vanilla does.
fSurfaceTrimDb = 0

; Global trim on the small filler taps that give a burst its texture.
fGrainTrimDb = 0

; Global trim on the scrape and cloth loops.
fLoopTrimDb = 0

; Below this a sound is not worth a voice and is dropped before the cap ever sees it. Raise it to
; keep the voice budget for things that can actually be heard.
fVoiceFloorDb = -100


[Compress]

; Hold the top of one class of cue down without touching the rest of it. Every threshold below is
; 0 by default, which is the top of the range and therefore no holding at all, so switching this
; on changes nothing until you lower one.
;
; For squeezing the whole range instead of its top, the controls already exist and are global:
; Intensity:fDynamicRangeDb and the two soft-clip knees.
bEnabled = 0

; Decibels in per decibel out, above a threshold. 1 is off. 4 squeezes the loud ones together
; while leaving them distinguishable. 20 is near enough a hard cap to be one - and a hard cap is
; worth avoiding, because everything over the threshold arrives at exactly the threshold and a
; dozen different impacts become a dozen identical ones. One ratio for every class: the thresholds
; say which classes get held, this says how firmly.
fRatio = 4

; Where a four-layer impact starts being held, in dB under the loudest thing this mod can produce.
; 0 is that top, so it holds nothing. The whole stack comes down together, so a held impact keeps
; its transient/body/sub balance and loses only level. Its surface skin is part of the same moment
; and rides on this.
fImpactDb = 0

; Where the small filler taps start being held, in dB under the mod's loudest. The line most worth
; pulling down: nine of every ten contacts are taps, so a tap that can reach the top of the range
; is a tumble with no shape to it. Lower it and the hero hits stand out without anything else
; getting quieter.
fTapDb = 0

; Where the head accent starts being held, in dB under the mod's loudest. Holds the accent once
; the lead boost is in without taking it off the sort - unlike HeadImpact:fLeadMaxLevelDb, which
; does both, and unlike that one this squeezes rather than clamps.
fHeadDb = 0

; Where the bone crunch starts being held, in dB under the mod's loudest.
fCrunchDb = 0

; Where the wet gore layer starts being held, in dB under the mod's loudest.
fGoreDb = 0

; Where the sliding scrape loop starts being held, in dB under the mod's loudest. A loop is
; re-levelled while it runs, so this is the one class where the holding happens continuously
; rather than at one instant.
fScrapeDb = 0

; Where the cloth bed starts being held, in dB under the mod's loudest.
fFoleyDb = 0

; Where the airborne whoosh starts being held, in dB under the mod's loudest.
fAirborneDb = 0

; Where the closing cue starts being held, in dB under the mod's loudest.
fSettleDb = 0


[Player]

; Whether your own ragdoll makes any sound at all.
bEnabled = 1

; At arm's length collapsing every layer to one point stops helping and starts sounding like the
; audio is inside your head, so your own limbs carry their own sounds.
bAttachToBones = 1

; A 30 Hz boom at zero distance through headphones is overwhelming, and in VR low frequency is
; felt as much as heard. This pulls it back for your own falls only.
fSubTrimDb = 0

; You are the one moving and the view already tells you, so the anticipation whoosh is off for
; your own falls.
bSkipAirborneWhoosh = 1

; Your own ragdoll's level, separate from everyone else's.
fMasterGainDb = -3


[Distance]

; Inside this everything plays: composites, grains, loops and bed. About ten metres.
fFullRadius = 700

; Between the two radii only the hero composites play - nobody resolves the detail at that range.
; Beyond it the actor is dropped entirely, which is what keeps a battlefield of ragdolls from ever
; becoming a performance question.
fSimplifiedRadius = 2100


[Slots]

; Pick variants out of a shuffled bag rather than at random. Random repeats itself immediately,
; and an immediate repeat is exactly what people notice.
bShuffleBag = 1

; Give every cue its own dice, rolled from the contact it came from, instead of dealing from one
; running deck. Off, adding or removing a single cue early in a take re-rolls the sample and the
; pitch of everything after it and two exports differ everywhere rather than where the change bit.
; The seed below still re-rolls the whole take, so the variety is unchanged.
bStableVariants = 1

; 0 seeds from the clock, which is what the game wants. Any other value makes every run identical,
; which is what an A/B between two configs needs so it compares the configs and not two dice
; rolls.
iRngSeed = 1


[Layers]

; The contact itself - bright, fast, and the quietest layer of the stack. Mute it and an impact
; loses its edge but keeps its weight.
bImpTransient = 1

; Low-mid flesh and mass, arriving ~20 ms in. The main body of the sound at ordinary intensities,
; where the sub has not taken over yet.
bImpBody = 1

; The late pitched boom, ~65 ms in. The design's central claim is that this one layer is what
; makes a hit read as mass rather than contact - mute it and the gnarl should leave with it. If it
; does not, the balance is wrong, not the timing.
bImpSub = 1

; The hollow knock layered on when a body lands on wood. Mute the three surf_* slots together to
; hear how much of the mix is surface identity at all.
bSurfWood = 1

; The hard, short skin for stone. Vanilla plays the same dirt sample for stone, ice and carpet
; alike, so this is one of the differences the mod exists to make.
bSurfStone = 1

; The dull skin, and the fallback for every surface we cannot resolve - which today means all
; natural ground, since no dirt, grass or snow contact exists in the capture set.
bSurfSoft = 1

; The burst filler: quiet, dry, heavily pitch-scattered taps that give a burst its three to five
; grains. Mute it to hear the bursts reduced to their hero hits alone.
bLimbTap = 1

; The granular low-mid crackle that is what a bone break actually is - ten times the transient
; density of a plain thud in that band, not a snap sample.
bCrunchGran = 1

; The wet squelch, obliterate tier only. The fastest way to check the gore gate is not opening on
; ordinary knockdowns.
bGoreWet = 1

; The sliding rumble. Worth muting often: nothing in the capture set is actually a slide, so this
; is the layer most likely to be firing when it should not.
bScrapeLoop = 1

; The continuous cloth bed under everything, 30-36 dB down. Mute it to hear how much work it does
; papering over the one-shots - the references say a great deal.
bFoleyCloth = 0

; The airborne anticipation rise. Mute it to judge whether the fall still reads as a fall without
; being told one is coming.
bAirWhoosh = 0

; The dull skull thud with its granular edge. Mute it to check the head gate is firing on head
; contacts and not on everything that happens to be moving fast.
bHeadImpact = 1

; The soft final flop that closes the event. Mute it and falls should audibly trail off
; unfinished, which is the whole reason it exists.
bSettleRest = 1

