; RagdollSounds_Algorithm.ini - written by the testbench
; Written by Physical Ragdoll Sounds. Every key carries the comment that says
; what it changes perceptually; delete a key to go back to its default.


[Ingest]

; The quietest contact allowed to make any sound at all. Raise it and the small taps that fill out
; a tumble disappear; lower it and the settle at the end of a fall starts chattering.
fMinImpactSpeed = 20

; How far the solver's closing speed and our own reconstruction of it may differ before the
; contact is treated as a physics explosion and thrown away. Lower is stricter: too low and real
; hard landings go silent.
fBlowupDisagreeFrac = 0.1

; Backstop for contacts with no reconstruction to check against. Anything faster is discarded as
; impossible, so setting it low makes the hardest hits in the game the only ones that never play.
fBlowupSpeedCeiling = 1000

; The same backstop for spin. A genuine armoured landing spins a limb to 60 rad/s, so anything
; near that discards real impacts.
fBlowupAngularCeiling = 200

; Half of all contacts are one limb touching another limb of the same body. Below this they only
; thicken the cloth bed; above it they play as real impacts. Drop it and a ragdoll rattles against
; itself constantly.
fSelfContactThreshold = 250

; Every limb-on-own-limb contact is reported twice, once from each limb. Off, they all play twice
; and the whole mix doubles at the moment of landing.
bDropMirroredSelfContacts = 1

; How large a gap between contact reports means a new frame started. Only matters on replay; the
; measured split is one microsecond inside a frame against 20 ms between.
fFrameGapMs = 2

; One collision surface reported at several points becomes one contact at the strongest of them.
; Off, a flat landing on a floor plays several times over.
bCollapseManifolds = 1

; How much faster a contact must be sliding along a surface than into it before it is heard as a
; scrape rather than a thud. Lower sends more of a tumble to the scrape loop and takes the punch
; out of it.
fGrazeRatio = 1.5


[Phase]

; How far off the ground the body has to be before the airborne rise starts. Too low and the
; whoosh fires during an ordinary shove.
fAirborneMinHeight = 40

; And for how long, so a body that bounces once does not read as a fall.
fAirborneMinTimeMs = 120

; How big a share of the fall's energy a contact must carry to count as the hero moment. Higher
; means fewer knockdowns get a hero treatment and more of them read as a flat tumble.
fPrimaryImpactEnergyFrac = 0.35

; How long the hero moment stays open for its peers. A faceplant genuinely has a knee, a chest and
; a head arriving inside a couple of hundred milliseconds; shorten this and only the first of them
; is loud.
fPrimaryImpactWindowMs = 220

; How fast a body has to be travelling along the ground before the slide phase opens and the
; grinding loop is allowed.
fSlideMinTangentSpeed = 120

; And for how long, so a single glancing blow does not read as a slide.
fSlideMinDurationMs = 150

; The energy the fall has to drop below before it is considered over. Raise it and knockdowns
; close early, cutting off the last real bounce; lower it and the closing cue arrives late.
fSettleEnergyFloor = 45

; How much quiet is needed before the event closes. This is what stops a fall that pauses
; mid-tumble playing its closing cue too early.
fSettleQuietMs = 300

; Silence held after a ragdoll ends, covering the blend back to animation. A guess: every capture
; take was paralysed and none of them ever got up.
fGetUpBlendMs = 400

; How loud the moment of being knocked over is, before anything has landed.
fLaunchTrimDb = -6

; How many sounds the launch may spend at once.
iLaunchMaxCues = 2

; How loud anything is while the body is in the air. Should be well down: the airborne section is
; anticipation, not event.
fAirborneTrimDb = -9

; How many sounds may play while airborne.
iAirborneMaxCues = 1

; The hero moment's own trim. This is the reference every other phase is quieter than, so moving
; it moves the whole knockdown.
fPrimaryImpactTrimDb = 0

; How many grains the hero burst may contain. The references measure three to five.
iPrimaryImpactMaxCues = 5

; How loud the rolling section after the first landing is.
fTumbleTrimDb = -3

; How many grains a tumble burst may contain.
iTumbleMaxCues = 4

; How loud the impacts during a slide are. The grinding loop has its own gain.
fSlideTrimDb = -6

; How many one-shots may punctuate a slide, for the moments a limb catches.
iSlideMaxCues = 2

; The last twenty contacts of every knockdown are settles and should be nearly silent. This one
; number is what keeps a fall from ending in a rattle.
fSettleTrimDb = -14

; How many sounds the settle may spend. One is the design.
iSettleMaxCues = 1


[Arbitration]

; The shortest gap allowed between any two impact onsets, whatever limb they came from. Below
; about 46 ms extra onsets stop adding detail and start adding mud; well above it a knockdown
; starts to sound sparse and deliberate.
fRateCapMs = 46

; How long one limb chain stays claimed by its strongest contact. This is what turns a hand, a
; wrist and an elbow landing together into one arm flop.
fChainMergeWindowMs = 60

; How far under the loudest recent sound a proposal has to be before it is dropped outright rather
; than played quietly. Small values let everything through and the landing turns to porridge;
; large values leave only the heroes.
fMaskDropBelowDb = 12

; How fast the ear is assumed to recover after a loud hit. Slower means a big landing keeps the
; following second quiet.
fMaskDecayDbPerSec = 60

; How many sounds one audible moment is built from. The references measure three to five; more
; reads as a machine gun rather than as an impact with texture.
iBurstMaxGrains = 5

; How long one burst may last before it has to end. This plus the grain count is the shape of an
; audible moment.
fBurstWindowMs = 300

; The silence enforced between audible moments. This is the single biggest lever on whether a
; three-second tumble reads as four events or as thirty.
fBurstMinGapMs = 300

; During a hero moment, place every layer at one point. Several points read as several events; one
; point reads as one event with detail.
bSpatialCollapseOnHero = 1

; How long the collapse holds before the sound spreads back out across the limbs for the tumble.
fSpatialCollapseWindowMs = 200

; The hard ceiling on how many sounds one falling body may hold at once.
iVoiceCapPerActor = 8

; The same for the whole scene, so a battlefield of ragdolls stays a mix rather than a wall.
iVoiceCapGlobal = 16

; How many frames every window is worth as well as its millisecond floor, so the system behaves
; the same at 24 fps and at 144. Zero pins every window to its floor and makes the mod frame-rate
; dependent.
fFrameScaleK = 2


[Intensity]

; The contact speed that maps to the bottom of the loudness range. Anything at or under it is as
; quiet as the mod goes.
fSpeedRefLow = 20

; The contact speed that maps to full level. A guess, not a measurement: the take that would have
; established it was discarded. Lower it and ordinary knockdowns get loud; raise it and nothing
; ever reaches the top of the range.
fSpeedRefHigh = 960

; The whole span from the quietest contact to the loudest, in decibels. The references use about
; 35; a naive loudness curve gives 60 and sounds wrong at both ends - shouty at the top, inaudible
; at the bottom.
fDynamicRangeDb = 35

; Where the loudness sits between the two anchors. Under 1 fills the middle out and makes ordinary
; contacts more present; over 1 keeps everything quiet until it is genuinely hard.
fCurveExponent = 0.75

; Where the curve stops being straight and starts compressing, so another mod's absurd impulse
; gets loud rather than rejected. A silent obliterate is the worst possible outcome.
fSoftClipKnee = 0.85

; How much a limb's own size makes it louder. At zero a fingertip and a torso at the same speed
; sound identical; high values make torso landings dominate everything.
fMassWeight = 0.35

; The same, from the limb's physical bounding radius rather than its mass. This is the half that
; still works on a skeleton we do not recognise.
fRadiusWeight = 0.2

; Where a contact stops being a fall and the gore tier opens, as a multiple of the loud anchor.
; Above 1 is above anything the mod treats as loud, which is where it belongs; under 1 and
; ordinary hard landings start coming apart.
fObliterateFrac = 1.4583


[ImpactComposite]

; The core layer stack. Off, the mod plays only accents and loops and every impact loses its body.
bEnabled = 1

; When the bright contact click lands. This is the reference everything else is measured from and
; should stay at zero.
fTransientOffsetMs = 0

; When the wood, stone or soft colour arrives. Close to the transient, or it stops reading as the
; same event.
fSurfaceOffsetMs = 8

; When the low-mid flesh and mass arrives. Measured at 8-34 ms in the references.
fBodyOffsetMs = 20

; When the pitched boom arrives. The single most important number in the mod: at 65 ms an impact
; reads as mass, at 0 it reads as a click with a thud stuck to it, and past 120 ms it stops
; belonging to the impact at all.
fSubOffsetMs = 65

; A few milliseconds of variation on each layer so no two composites have exactly the same
; envelope. Large values smear the shape instead of varying it.
fOffsetScatterMs = 4

; How much of the stack is the bright click on the lightest contact. Light contacts are almost all
; transient.
fTransientGainAtMinDb = -5

; And on the heaviest, where it only rides on top of the sub.
fTransientGainAtMaxDb = -18

; How much flesh a light contact has.
fBodyGainAtMinDb = -8

; And a heavy one.
fBodyGainAtMaxDb = -2

; How much boom a light tap gets. Should be almost none, or every tap sounds like a cannon.
fSubGainAtMinDb = -30

; And a hard landing, where it is the loudest thing in the stack. This is where the gnarl comes
; from.
fSubGainAtMaxDb = 0

; How audible the surface colour is on a light contact.
fSurfaceGainAtMinDb = -12

; And on a heavy one. If the surface reads as a separate sound rather than as colour, it is too
; loud.
fSurfaceGainAtMaxDb = -6

; Random pitch spread per voice. This is what stops thirteen files sounding like thirteen files.
; Past about three semitones it starts sounding like a pitch trick.
fPitchScatterSemis = 2.5

; How far down a heavy impact is pitched relative to a light one. Negative reads as heavier and
; bigger for free.
fPitchIntensityBiasSemis = -3

; The hard limit on the two above put together, so nothing ever sounds obviously transposed.
fPitchMaxSemis = 3


[HeadImpact]

; Head contacts get their own accent on top of the composite. Off, a head landing is just another
; limb.
bEnabled = 1

; How hard a head has to hit before the accent fires, as a multiple of the loud anchor - so it
; stays where it is in the range when the anchor moves. Low values put a skull crack on every roll
; of the neck.
fGateFrac = 0.3125

; How loud the head accent is against the stack.
fGainDb = -2

; How much more willing the gate is when the head is already the low point of the body - a
; faceplant rather than a knock.
fHeadDownBonus = 0.25


[CrunchGore]

; The granular bone-break layer. This is most of what makes the mod gnarly.
bCrunchEnabled = 1

; The wet layer, above the obliterate tier. Nothing a fall can produce reaches it.
bGoreEnabled = 1

; Where a crunch becomes possible, as a multiple of the loud anchor. An ordinary shove peaks at
; about half of it and a three-metre fall at three quarters, so the default has an ordinary
; knockdown crack occasionally and a real fall crack always.
fCrunchGateFrac = 0.5208

; Where a crunch becomes guaranteed, on the same scale. The span between this and the gate is the
; probability ramp - soften a gate with probability, never with volume. At or below the gate it is
; a hard threshold instead.
fCrunchCertainFrac = 0.7292

; How far back below the gate the impact has to fall before another crunch is possible, on the
; same scale as the gate, so it does not flicker on and off during a tumble.
fCrunchHysteresisFrac = 0.1458

; The ceiling per knockdown, so a long tumble does not turn into a bag of breaking sticks.
iMaxCrunchesPerEvent = 3

; Where the wet layer opens, as a multiple of the loud anchor. Should sit above anything a fall
; can produce, and the obliterate point has to be cleared as well.
fGoreGateFrac = 1.4583

; How loud a crunch is against the impact it rides on.
fCrunchGainDb = -13

; How loud the wet layer is.
fGoreGainDb = -6


[ScrapeLoop]

; The sustained grinding loop for a body dragging along a surface.
bEnabled = 1

; How fast the limb has to be travelling along the surface for the loop to be worth starting.
fMinTangentSpeed = 120

; How gently the grind arrives. Too short and it clicks in at the start of a slide.
fStartFadeMs = 310

; How gently it leaves. Longer than the fade in, or a slide ends abruptly.
fStopFadeMs = 840

; How long the contact has to persist before a loop opens, so a single glancing blow does not
; start one.
fMinDurationMs = 100

; How loud the grind sits under the impacts. The references put a slide 15-25 dB under them.
fGainDb = -28.5

; The sliding speed the loop is quietest at.
fSpeedForMinGain = 120

; And the speed it reaches full level at, so the grind tracks the slide rather than sitting at one
; level throughout.
fSpeedForMaxGain = 600

; How much faster the grind plays as the slide speeds up. A little sells the acceleration; a lot
; sounds like a tape being spooled.
fPitchPerThousandUnits = 0.15


[MotionFoley]

; The continuous cloth bed under everything. It is what papers over the one-shots and makes a fall
; sound like one continuous thing.
bEnabled = 1

; How loud the bed is. The references put it 30-36 dB under the hero hit; bring it up and it stops
; being a bed and starts being a sound.
fBedGainDb = -33

; The body speed the bed is quietest at.
fSpeedForMinGain = 30

; And the speed it reaches full level at, so the cloth tracks how fast the body is actually
; moving.
fSpeedForMaxGain = 500

; The anticipation whoosh while a body is in the air. On by default at a low level: it tells the
; ear something is about to land.
bAirborneRise = 1

; How loud the whoosh is. It should be felt rather than heard.
fAirborneRiseGainDb = -24

; Drop the bed for a moment just before a big landing so the hit lands harder. Three of four
; reference clips do it, which is not enough to be sure it was deliberate, so it ships off and is
; meant to be tuned by ear.
bPreImpactDuck = 0

; How far the bed drops for the duck. The references measure 8-15 dB.
fPreImpactDuckDb = -10

; How long before the landing the duck starts.
fPreImpactDuckMs = 70


[SettleClose]

; One quiet cue when the fall is over. Falls that just trail off feel unfinished.
bEnabled = 1

; How loud the closing flop is. It is punctuation, not an event.
fGainDb = -16

; How long after the body goes quiet the closing cue lands. Too soon and it sounds like another
; impact; too late and the fall has already been forgotten.
fDelayMs = 120


[Mix]

; The whole mod's level against the rest of the game. With vanilla's body impacts suppressed there
; is nothing to sit next to, so this calibrates against footsteps and combat - and there is no bus
; control in this engine, so it is the only lever.
fMasterGainDb = -0.5

; Global trim on the bright contact layer. Up for clicky and present, down for distant and soft.
fTransientTrimDb = 0

; Global trim on the flesh-and-mass layer.
fBodyTrimDb = 0

; Global trim on the pitched boom. The one control most worth touching if the mod feels either
; weightless or overbearing.
fSubTrimDb = 0

; Global trim on the wood, stone and soft colour. Up makes the floor material obvious; down makes
; every surface sound the same, which is what vanilla does.
fSurfaceTrimDb = 0

; Global trim on the small filler taps that give a burst its texture.
fGrainTrimDb = 0

; Global trim on the scrape and cloth loops.
fLoopTrimDb = 0

; Below this a sound is not worth a voice and is dropped before the cap ever sees it. Raise it to
; keep the voice budget for things that can actually be heard.
fVoiceFloorDb = -48


[Player]

; Whether your own ragdoll makes any sound at all.
bEnabled = 1

; At arm's length collapsing every layer to one point stops helping and starts sounding like the
; audio is inside your head, so your own limbs carry their own sounds.
bAttachToBones = 1

; A 30 Hz boom at zero distance through headphones is overwhelming, and in VR low frequency is
; felt as much as heard. This pulls it back for your own falls only.
fSubTrimDb = -9

; You are the one moving and the view already tells you, so the anticipation whoosh is off for
; your own falls.
bSkipAirborneWhoosh = 1

; Your own ragdoll's level, separate from everyone else's.
fMasterGainDb = -3


[Distance]

; Inside this everything plays: composites, grains, loops and bed. About ten metres.
fFullRadius = 700

; Between the two radii only the hero composites play - nobody resolves the detail at that range.
; Beyond it the actor is dropped entirely, which is what keeps a battlefield of ragdolls from ever
; becoming a performance question.
fSimplifiedRadius = 2100


[Slots]

; Pick variants out of a shuffled bag rather than at random. Random repeats itself immediately,
; and an immediate repeat is exactly what people notice.
bShuffleBag = 1

; 0 seeds from the clock, which is what the game wants. Any other value makes every run identical,
; which is what an A/B between two configs needs so it compares the configs and not two dice
; rolls.
iRngSeed = 1


[Layers]

; The contact itself - bright, fast, and the quietest layer of the stack. Mute it and an impact
; loses its edge but keeps its weight.
bImpTransient = 1

; Low-mid flesh and mass, arriving ~20 ms in. The main body of the sound at ordinary intensities,
; where the sub has not taken over yet.
bImpBody = 1

; The late pitched boom, ~65 ms in. The design's central claim is that this one layer is what
; makes a hit read as mass rather than contact - mute it and the gnarl should leave with it. If it
; does not, the balance is wrong, not the timing.
bImpSub = 1

; The hollow knock layered on when a body lands on wood. Mute the three surf_* slots together to
; hear how much of the mix is surface identity at all.
bSurfWood = 1

; The hard, short skin for stone. Vanilla plays the same dirt sample for stone, ice and carpet
; alike, so this is one of the differences the mod exists to make.
bSurfStone = 1

; The dull skin, and the fallback for every surface we cannot resolve - which today means all
; natural ground, since no dirt, grass or snow contact exists in the capture set.
bSurfSoft = 1

; The burst filler: quiet, dry, heavily pitch-scattered taps that give a burst its three to five
; grains. Mute it to hear the bursts reduced to their hero hits alone.
bLimbTap = 1

; The granular low-mid crackle that is what a bone break actually is - ten times the transient
; density of a plain thud in that band, not a snap sample.
bCrunchGran = 1

; The wet squelch, obliterate tier only. The fastest way to check the gore gate is not opening on
; ordinary knockdowns.
bGoreWet = 1

; The sliding rumble. Worth muting often: nothing in the capture set is actually a slide, so this
; is the layer most likely to be firing when it should not.
bScrapeLoop = 1

; The continuous cloth bed under everything, 30-36 dB down. Mute it to hear how much work it does
; papering over the one-shots - the references say a great deal.
bFoleyCloth = 0

; The airborne anticipation rise. Mute it to judge whether the fall still reads as a fall without
; being told one is coming.
bAirWhoosh = 0

; The dull skull thud with its granular edge. Mute it to check the head gate is firing on head
; contacts and not on everything that happens to be moving fast.
bHeadImpact = 1

; The soft final flop that closes the event. Mute it and falls should audibly trail off
; unfinished, which is the whole reason it exists.
bSettleRest = 1

