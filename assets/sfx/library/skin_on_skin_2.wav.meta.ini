Warning = tail|104 ms of event inside a 409 ms file. The rest is room, and the game applies the cell's own on top - a baked tail sounds like a cave inside a cave, and it turns overlapping impacts to mud.\n\nFix: `sfx.py make --len` cuts to the event, or generate the take dry. The repair pass will not do it: where a decay stops being the sound and starts being the room is a judgement, and trimming it wrong takes the body off the hit.
