Warning = contacts|7 contacts at least 46 ms apart, the loudest pair 0 dB apart.\n\nNot a fault - it is several one-shots in one file, and cutting them is where all four shipped `limb_tap` files came from (03-Asset-Status.md §3.3). But assigned whole it plays whole: the slot fires once and every contact in the file sounds.\n\nFix: `python tools/sfx.py split <file>`, then import the pieces.
Warning = tail|198 ms of event inside a 882 ms file. The rest is room, and the game applies the cell's own on top - a baked tail sounds like a cave inside a cave, and it turns overlapping impacts to mud.\n\nFix: `sfx.py make --len` cuts to the event, or generate the take dry. The repair pass will not do it: where a decay stops being the sound and starts being the room is a judgement, and trimming it wrong takes the body off the hit.
