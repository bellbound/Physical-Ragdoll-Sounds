Warning = noisy|38 dB between the hit and the room tone in front of it. Past the 30 dB gate, so it is usable, but it will be audible under a quiet cell and it stacks with every other layer in the impact.\n\nNothing repairs this; it is worth knowing before it goes on `surf_soft`, which fires on everything unresolved.
Warning = very long|14.9 s and it does not measure as a texture. Either it has a baked room tail or it is several sounds in one file.\n\nA long file is not wrong on its own: Slots.md §6 wants textures cut both ways, and the only `scrape_loop` to pass the 2026-08-23 batch was a 9.9 s long cut. It is wrong in a one-shot slot, which plays the whole of it.\n\nFix: `sfx.py make` windows it.
Warning = tail|4940 ms of event inside a 14938 ms file. The rest is room, and the game applies the cell's own on top - a baked tail sounds like a cave inside a cave, and it turns overlapping impacts to mud.\n\nFix: `sfx.py make --len` cuts to the event, or generate the take dry. The repair pass will not do it: where a decay stops being the sound and starts being the room is a judgement, and trimming it wrong takes the body off the hit.
