Warning = satellite|a second contact +170 ms from the hero, -21 dB under it.\n\n03-Asset-Status.md §7 found one of these in 39 takes out of 100 - usually a bright debris wash the generator bolted on. Left in, it lands on top of whatever the engine schedules next and reads as a flam; on an impact layer it collides with `imp_sub`'s own arrival at +55-75 ms.\n\nFix: cut it. `python tools/sfx.py split <file>` cuts at the 46 ms contact floor, and tools/triage_batch.py drops satellites at exactly this 20 dB threshold and records every one.
